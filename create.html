<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สร้างเอกสาร — Riverpark</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex" style="font-family:'Inter','IBM Plex Sans Thai',sans-serif;">

  <!-- ════════════════════════════════════════════ SIDEBAR ════════════════════════════════════════════ -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-[260px] bg-white border-r border-slate-100 shadow-sm flex flex-col z-[500] overflow-hidden">

    <div class="sidebar-expanded-header flex items-center gap-3 px-5 border-b border-slate-100" style="height:64px;">
      <div class="w-9 h-9 rounded-xl overflow-hidden flex-shrink-0 bg-slate-100">
        <img src="image/logo.png" alt="Logo" class="w-full h-full object-cover" />
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-slate-800 truncate leading-tight" data-i18n="app.name"></p>
        <p class="text-[11px] text-slate-400 truncate" data-i18n="app.sub"></p>
      </div>
      <button id="collapse-btn" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0 transition-colors">
        <img src="icon/menu-01.svg" width="20" height="20" alt="" />
      </button>
    </div>

    <div class="sidebar-collapsed-header hidden items-center justify-center border-b border-slate-100" style="height:64px;">
      <button id="expand-btn" class="w-9 h-9 rounded-xl overflow-hidden hover:opacity-80 transition-opacity" data-i18n-title="app.name">
        <img src="image/logo.png" alt="Logo" class="w-full h-full object-cover" />
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-0.5">
      <p class="nav-section-title text-[10px] font-semibold text-slate-300 uppercase tracking-widest px-3 pt-3 pb-1.5" data-i18n="nav.main"></p>

      <a href="index.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span class="nav-text" data-i18n="nav.registry"></span>
      </a>

      <a href="#" data-my-work class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span class="nav-text" data-i18n="nav.myWork"></span>
      </a>

      <a href="create.html" class="nav-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <span class="nav-text" data-i18n="nav.create"></span>
      </a>

      <a href="#" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span class="nav-text" data-i18n="nav.track"></span>
      </a>

      <div class="flex-1"></div>

      <p class="nav-section-title text-[10px] font-semibold text-slate-300 uppercase tracking-widest px-3 pt-5 pb-1.5" data-i18n="nav.system"></p>
      <a href="#" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><circle cx="12" cy="12" r="3"></circle><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"></path></svg>
        <span class="nav-text" data-i18n="nav.settings"></span>
      </a>
    </nav>

    <div class="sidebar-expanded-header flex items-center gap-3 px-4 py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <p data-user-name class="text-[13px] font-semibold text-slate-800 truncate leading-tight"></p>
        <p data-user-rolesub class="text-[11px] text-slate-400 truncate"></p>
      </div>
    </div>

    <div class="sidebar-collapsed-header hidden items-center justify-center py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold"></div>
    </div>

  </aside>

  <!-- ════════════════════════════════════════════ MAIN ════════════════════════════════════════════ -->
  <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden" style="margin-left:260px;">

    <!-- ── Topbar ── -->
    <div class="flex-shrink-0 z-[100] bg-white border-b border-slate-100 flex items-center justify-between px-8" style="height:64px;">
      <div class="flex items-center gap-2 text-[13px] font-medium">
        <a href="index.html" class="w-8 h-8 rounded-lg border border-slate-200 flex items-center justify-center text-slate-400 hover:bg-slate-50 hover:text-blue-600 transition-colors mr-1">
          <img src="icon/chevron-left.svg" width="14" height="14" alt="" />
        </a>
        <a href="index.html" class="text-slate-400 no-underline hover:text-blue-600 transition-colors" data-i18n="common.dashboard"></a>
        <span class="text-slate-300">/</span>
        <span id="bc-title" class="text-slate-900 font-semibold" data-i18n="nav.create"></span>
      </div>
      <div class="flex items-center gap-3">
        <span data-role-badge class="hidden lg:inline-flex items-center gap-2 rounded-xl bg-blue-50 px-3 py-2 text-[12.5px] font-semibold text-blue-600"></span>
        <button id="notif-btn" class="relative w-10 h-10 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-400 shadow-sm hover:bg-slate-50 hover:text-blue-600 transition-colors" data-i18n-aria="common.notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <button id="user-btn" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 hover:bg-slate-100 transition-colors cursor-pointer">
          <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[13px] font-bold"></div>
          <span data-user-name class="text-sm font-semibold text-slate-900"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </div>

    <!-- ── Content ── -->
    <div id="doc-content-area" class="flex-1 min-h-0 flex flex-col p-3 gap-3">

      <div id="doc-card" class="flex-1 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">

        <div class="px-8 pt-3 pb-2.5 border-b border-slate-100 flex-shrink-0">
          <h1 class="text-[18px] font-bold text-slate-900" data-i18n="cr.title"></h1>
          <p class="mt-0.5 text-[12px] text-slate-400" data-i18n="cr.sub"></p>
        </div>

        <div id="doc-zone" class="flex-1 min-h-0 flex flex-col gap-3 p-3 overflow-y-auto" style="background:#fefefe;">

        <!-- ① Tab group -->
        <div id="doc-tabs" class="bg-white rounded-2xl overflow-x-auto flex-shrink-0" style="border:1px solid #ffffff; box-shadow:0 16px 16px rgba(0,0,0,0.10);">
          <div class="flex gap-2 min-w-max p-3">
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold transition-all duration-200 bg-blue-600 text-white shadow-sm" data-step="1" data-i18n="cr.s1"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="2" data-i18n="cr.s2"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="3" data-i18n="cr.s3"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="4" data-i18n="cr.s4"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="5" data-i18n="cr.s5"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="6" data-i18n="cr.s6"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="7" data-i18n="cr.s7"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="8" data-i18n="cr.s8"></button>
            <button class="step-tab flex-shrink-0 rounded-xl px-4 py-2 text-[12.5px] font-semibold text-slate-500 transition-all duration-200 hover:bg-slate-100" data-step="9" data-i18n="cr.s9"></button>
          </div>
        </div>

        <!-- ② Content group -->
        <div id="doc-box" class="bg-white rounded-2xl flex-1 min-h-0 overflow-y-auto" style="border:1px solid #FFFFFF; box-shadow:0 4px 16px rgba(0,0,0,0.10); display:flex; padding:18px; flex-direction:column; align-items:flex-start; gap:16px; align-self:stretch;">

          <!-- Step 1 -->
          <div id="step-1" class="step-content flex flex-col gap-4 w-full">
            <div class="flex flex-col gap-1.5">
              <label for="f-empid" class="text-[13px] font-normal text-slate-700" data-i18n="cr.empId"></label>
              <input id="f-empid" type="text" data-i18n-ph="common.fill" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
            </div>

            <div class="grid grid-cols-[160px_1fr_1fr] gap-4">
              <div class="flex flex-col gap-1.5">
                <label for="f-prefix" class="text-[13px] font-normal text-slate-700" data-i18n="cr.prefix"></label>
                <div class="relative">
                  <select id="f-prefix" class="w-full appearance-none rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all bg-white cursor-pointer">
                    <option value="" disabled selected data-i18n="common.select"></option>
                    <option>นาย</option><option>นาง</option><option>นางสาว</option>
                  </select>
                  <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </span>
                </div>
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="f-fname" class="text-[13px] font-normal text-slate-700" data-i18n="cr.fname"></label>
                <input id="f-fname" type="text" data-i18n-ph="common.fill" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="f-lname" class="text-[13px] font-normal text-slate-700" data-i18n="cr.lname"></label>
                <input id="f-lname" type="text" data-i18n-ph="common.fill" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div class="flex flex-col gap-1.5">
                <label for="f-dept" class="text-[13px] font-normal text-slate-700" data-i18n="cr.dept"></label>
                <div class="relative">
                  <select id="f-dept" class="w-full appearance-none rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all bg-white cursor-pointer">
                    <option value="" disabled selected data-i18n="common.fill"></option>
                    <option>ฝ่ายผลิต</option><option>ฝ่ายบุคคล</option><option>ฝ่ายการเงิน</option><option>ฝ่าย IT</option>
                  </select>
                  <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </span>
                </div>
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="f-date" class="text-[13px] font-normal text-slate-700" data-i18n="cr.date"></label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                  </span>
                  <input id="f-date" type="text" placeholder="DD/MM/YYYY" class="w-full rounded-xl border border-slate-200 pl-11 pr-4 py-3 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
                </div>
              </div>
            </div>
          </div>

          <!-- Step 2 -->
          <div id="step-2" class="step-content hidden flex flex-col gap-4 w-full">
            <div class="flex flex-wrap gap-x-8 gap-y-3">
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="purpose" value="new" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13px] text-slate-700" data-i18n="cr.p.new"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="purpose" value="edit" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13px] text-slate-700" data-i18n="cr.p.edit"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="purpose" value="cancel" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13px] text-slate-700" data-i18n="cr.p.cancel"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="purpose" value="copy" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13px] text-slate-700" data-i18n="cr.p.copy"></span>
              </label>
            </div>

            <div class="flex">
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="purpose" value="other" id="purpose-other" class="w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.p.other"></span>
              </label>
            </div>

            <div class="flex flex-col gap-1.5">
              <label for="purpose-detail" class="text-[13px] font-semibold text-slate-700" data-i18n="cr.detail"></label>
              <textarea id="purpose-detail" rows="3" data-i18n-ph="cr.detail" class="rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300 resize-none"></textarea>
            </div>
          </div>

          <!-- Step 3 -->
          <div id="step-3" class="step-content hidden flex flex-col gap-4 w-full">
            <div class="grid grid-cols-2 gap-x-16 gap-y-4">
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="qm" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.qm"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="qp" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.qp"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="wi" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.wi"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="sd" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.sd"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="form" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.form"></span>
              </label>
              <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="radio" name="doctype" value="esd" class="doc-type-radio w-4 h-4 accent-blue-600 cursor-pointer" />
                <span class="text-[13.5px] text-slate-700" data-i18n="cr.t.esd"></span>
              </label>
            </div>
          </div>

          <!-- Step 4 -->
          <div id="step-4" class="step-content hidden flex flex-col gap-4 w-full h-full">
            <div class="grid grid-cols-2 gap-4 w-full">
              <div class="flex flex-col gap-1.5">
                <label for="f-docname" class="text-[13px] font-normal text-slate-700" data-i18n="cr.docName"></label>
                <input id="f-docname" type="text" data-i18n-ph="common.fill" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="f-docno" class="text-[13px] font-normal text-slate-700" data-i18n="cr.docNo"></label>
                <input id="f-docno" type="text" data-i18n-ph="common.fill" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
              </div>
            </div>

            <div class="flex items-end gap-4 w-full">
              <div class="flex flex-col gap-1.5 w-[160px] flex-shrink-0">
                <label for="f-revision" class="text-[13px] font-normal text-slate-700" data-i18n="cr.revision"></label>
                <input id="f-revision" type="number" placeholder="0" min="0" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-800 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
              </div>
              <div class="flex flex-col gap-1.5 flex-1">
                <label for="f-relateddept" class="text-[13px] font-normal text-slate-700" data-i18n="cr.relatedDept"></label>
                <div class="relative">
                  <select id="f-relateddept" class="w-full appearance-none rounded-xl border border-slate-200 px-4 py-2.5 text-sm text-slate-500 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all bg-white cursor-pointer">
                    <option value="" disabled selected data-i18n="common.fill"></option>
                    <option>ฝ่ายผลิต</option><option>ฝ่ายบุคคล</option><option>ฝ่ายการเงิน</option><option>ฝ่าย IT</option>
                  </select>
                  <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </span>
                </div>
              </div>

  <script>
  (function () {
    const esc = App.esc, T = k => I18N.t(k);
    const user = App.initChrome();
    if (!user) return;

    /* ─────────── โหลดเอกสารเดิม (ถ้ามี ?id=) ─────────── */
    const editId = new URLSearchParams(location.search).get('id');
    let editing = editId ? Store.getDoc(editId) : null;

    /* ผู้อนุมัติเปิดหน้าเดียวกับผู้ร้องขอเพื่อ "ตรวจสอบ" แล้วเซ็นในส่วนที่ 5.3 */
    const reviewMode = !!(editing && user.role === 'approver');

    /* ผู้มีส่วนเกี่ยวข้องเปิดหน้าเดียวกันเพื่อเซ็นช่องของตัวเองในส่วนที่ 5.2 */
    const mySlot = (editing && user.role === 'stakeholder') ? Store.mySignSlot(editing, user) : null;
    const signMode = !!mySlot;

    if (user.role !== 'requester' && !reviewMode && !signMode) { App.toast(T('dv.noAccess'), 'red'); location.replace(user.home); return; }
    if (!reviewMode && !signMode && editing && editing.requesterId !== user.id) editing = null;

    /* ─────────── stepper ─────────── */
    let currentStep = 1, isViewAll = false;
    const totalSteps = 9;
    const STEP_KEYS = { 1:'cr.s1',2:'cr.s2',3:'cr.s3',4:'cr.s4',5:'cr.s5',6:'cr.s6',7:'cr.s7',8:'cr.s8',9:'cr.s9' };

    function goToStep(step) {
      if (step < 1 || step > totalSteps) return;
      document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.step-tab').forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
        b.classList.add('text-slate-500');
        b.style.color = '';
      });
      document.getElementById('step-' + step).classList.remove('hidden');
      const tab = document.querySelector('[data-step="' + step + '"]');
      tab.classList.remove('text-slate-500');
      tab.classList.add('bg-blue-600', 'shadow-sm');
      tab.style.color = '#FFFFFF';
      tab.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      currentStep = step;
      document.getElementById('prev-btn').disabled = step === 1;
      document.getElementById('next-btn').style.display = step === totalSteps ? 'none' : '';
    }

    document.getElementById('prev-btn').addEventListener('click', () => goToStep(currentStep - 1));
    document.getElementById('next-btn').addEventListener('click', () => goToStep(currentStep + 1));

    document.querySelectorAll('.step-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = Number(btn.dataset.step);
        if (isViewAll) {
          document.querySelectorAll('.step-tab').forEach(t => {
            t.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
            t.classList.add('text-slate-500'); t.style.color = '';
          });
          btn.classList.remove('text-slate-500');
          btn.classList.add('bg-blue-600', 'shadow-sm');
          btn.style.color = '#FFFFFF';
          document.getElementById('step-' + step).scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else goToStep(step);
      });
    });

    /* ── ดูทั้งหมด ── */
    document.getElementById('view-all-btn').addEventListener('click', function () {
      isViewAll = !isViewAll;
      document.body.classList.toggle('view-all', isViewAll);
      const icon = isViewAll
        ? '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>'
        : '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>';

      if (isViewAll) {
        for (let i = 1; i <= totalSteps; i++) {
          const el = document.getElementById('step-' + i);
          el.classList.remove('hidden');
          if (i < 9 && !el.querySelector('.view-all-title')) {
            const h = document.createElement('h2');
            h.className = 'view-all-title text-[14px] font-bold text-slate-800 pb-3 border-b border-slate-100 w-full';
            h.setAttribute('data-i18n', STEP_KEYS[i]);
            h.textContent = T(STEP_KEYS[i]);
            el.insertBefore(h, el.firstChild);
          }
        }
        document.getElementById('prev-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        this.innerHTML = icon + '<span data-i18n="common.back">' + esc(T('common.back')) + '</span>';
      } else {
        document.querySelectorAll('.view-all-title').forEach(el => el.remove());
        document.getElementById('prev-btn').style.display = '';
        goToStep(currentStep);
        this.innerHTML = icon + '<span data-i18n="cr.viewAll">' + esc(T('cr.viewAll')) + '</span>';
      }
    });

    /* ─────────── radio toggle (คลิกซ้ำ = ยกเลิก) ─────────── */
    function makeToggleable(sel) {
      document.querySelectorAll(sel).forEach(r => {
        r.addEventListener('mousedown', function () { this._was = this.checked; });
        r.addEventListener('click', function () { if (this._was) { this.checked = false; this._was = false; } });
      });
    }
    makeToggleable('input[name="purpose"]');
    makeToggleable('input[name="doctype"]');

    /* ─────────── ตัวนับตัวอักษร ─────────── */
    const descArea = document.getElementById('desc-step4');
    const descCounter = document.getElementById('desc-counter');
    function paintCounter() {
      descCounter.textContent = (1000 - descArea.value.length).toLocaleString('en-US') + ' ' + T('cr.charsLeft');
    }
    descArea.addEventListener('input', paintCounter);

    /* ─────────── ไฟล์แนบ (สะสมได้ + ตรวจขนาด/ชนิด) ─────────── */
    const MAX_MB = 5;
    const OK_EXT = ['pdf', 'docx', 'xlsx', 'png', 'jpg', 'jpeg'];
    let files = editing ? (editing.files || []).slice() : [];

    const fileInput = document.getElementById('file-upload');
    const fileList  = document.getElementById('file-list');

    function paintFiles() {
      fileList.innerHTML = files.map((f, i) =>
        '<li class="flex items-center justify-between rounded-xl border border-slate-200 bg-white px-4 py-3 text-[13px]">' +
          '<div class="flex items-center gap-3 min-w-0">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
            '<span class="truncate text-slate-700 font-medium"></span>' +
          '</div>' +
          '<div class="flex items-center gap-3 flex-shrink-0 ml-4">' +
            (f.data
              ? '<span class="inline-flex items-center gap-1 rounded-lg bg-emerald-50 px-2 py-0.5 text-[11px] font-semibold text-emerald-600">' +
                '<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>PDF/IMG</span>'
              : (f.dropped ? '<span class="rounded-lg bg-amber-50 px-2 py-0.5 text-[11px] font-semibold text-amber-600">name only</span>' : '')) +
            '<span class="text-slate-400">' + (f.size / 1024).toFixed(1) + ' KB</span>' +
            '<button type="button" data-rm="' + i + '" class="text-slate-300 hover:text-red-500 transition-colors">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
            '</button>' +
          '</div>' +
        '</li>').join('');
      /* ใส่ชื่อไฟล์ด้วย textContent — ปลอดภัยจาก HTML injection */
      fileList.querySelectorAll('li').forEach((li, i) => {
        li.querySelector('.truncate').textContent = files[i].name;
      });
      fileList.querySelectorAll('[data-rm]').forEach(b => {
        b.addEventListener('click', () => { files.splice(Number(b.getAttribute('data-rm')), 1); paintFiles(); });
      });
    }

    /* เก็บไฟล์จริงเป็น data URL เพื่อให้เปิดดูได้ในหน้าเอกสาร
       ถ้าพื้นที่ไม่พอจะเก็บเฉพาะชื่อไฟล์แทน */
    function addFiles(list) {
      Array.from(list).forEach(f => {
        const ext = (f.name.split('.').pop() || '').toLowerCase();
        if (OK_EXT.indexOf(ext) === -1) { App.toast(f.name + ' — ' + T('cr.uploadHint'), 'red'); return; }
        if (f.size > MAX_MB * 1024 * 1024) { App.toast(f.name + ' > ' + MAX_MB + ' MB', 'red'); return; }
        if (files.some(x => x.name === f.name && x.size === f.size)) return;

        const rec = { name: f.name, size: f.size, kind: 'change' };
        files.push(rec);
        paintFiles();

        /* base64 ใหญ่กว่าไฟล์จริง ~4/3 เท่า */
        if (f.size * 1.37 > Store.quotaLeft()) {
          rec.dropped = true;
          App.toast(T('cr.quotaFull'), 'amber');
          return;
        }
        const rd = new FileReader();
        rd.onload = e => { rec.data = e.target.result; paintFiles(); };
        rd.readAsDataURL(f);
      });
    }

    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
    const dropZone = fileInput.closest('label');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('bg-blue-50'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('bg-blue-50'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('bg-blue-50');
      addFiles(e.dataTransfer.files);
    });

    /* ─────────── ผู้มีส่วนเกี่ยวข้อง (ส่วนที่ 5.2) ─────────── */
    const sel = document.getElementById('related-select');
    const chipsEl = document.getElementById('related-chips');
    const mirror = document.getElementById('related-chips-mirror');
    const signSection = document.getElementById('related-sign-section');
    const signBoxes = document.getElementById('related-sign-boxes');
    let related = editing ? (editing.stakeholders || []).map(s => s.id) : [];

    function paintOptions() {
      const lang = I18N.getLang();
      sel.innerHTML = '<option value="" disabled selected>' + esc(T('common.selectData')) + '</option>' +
        Store.STAKEHOLDER_POOL.map(s =>
          '<option value="' + esc(s.id) + '"' + (related.indexOf(s.id) !== -1 ? ' disabled' : '') + '>' +
          esc(lang === 'en' ? s.nameEn : s.name) + '</option>').join('');
    }

    function poolName(id) {
      const s = Store.STAKEHOLDER_POOL.find(x => x.id === id);
      if (!s) return id;
      return I18N.getLang() === 'en' ? s.nameEn : s.name;
    }

    function paintRelated() {
      chipsEl.innerHTML = ''; mirror.innerHTML = ''; signBoxes.innerHTML = '';
      if (!related.length) { signSection.classList.add('hidden'); paintOptions(); return; }
      signSection.classList.remove('hidden');

      related.forEach(id => {
        const label = poolName(id);

        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-[12px] font-semibold';
        chip.style.cssText = 'background:#EFF6FF; color:#2563EB;';
        chip.appendChild(document.createTextNode(label));
        const x = document.createElement('button');
        x.type = 'button';
        x.className = 'leading-none text-blue-400 hover:text-blue-700 transition-colors';
        x.style.fontSize = '13px';
        x.innerHTML = '&times;';
        x.addEventListener('click', () => { related = related.filter(v => v !== id); paintRelated(); });
        chip.appendChild(x);
        chipsEl.appendChild(chip);

        const m = document.createElement('span');
        m.className = 'inline-flex items-center rounded-full px-3 py-1 text-[12px] font-semibold';
        m.style.cssText = 'background:#EFF6FF; color:#2563EB;';
        m.textContent = label;
        mirror.appendChild(m);

        const col = document.createElement('div');
        col.className = 'flex flex-col gap-3';
        col.innerHTML =
          '<p class="text-[13px] font-normal text-slate-700"></p>' +
          '<div class="sign-box rounded-2xl border border-slate-200 flex items-center justify-center" style="min-height:160px;">' +
            '<button type="button" data-sign-btn class="rounded-xl px-6 py-2.5 text-sm font-semibold text-white transition-colors" style="background:#4338ca;">' + esc(T('cr.signDoc')) + '</button>' +
          '</div>' +
          '<div class="flex flex-col gap-2 text-[13px] text-slate-700 items-center text-center">' +
            '<p>' + esc(T('cr.name')) + '<span class="border-b border-slate-400 inline-block" style="width:200px;">&nbsp;</span></p>' +
            '<p>' + esc(T('cr.signDate')) + '&nbsp;<span class="border-b border-slate-400 inline-block" style="width:160px;">&nbsp;</span></p>' +
          '</div>';
        col.querySelector('p').textContent = label;
        SignModal.bind(col.querySelector('[data-sign-btn]'));
        signBoxes.appendChild(col);
      });

      signBoxes.className = related.length === 1
        ? 'grid grid-cols-1 gap-6 w-full max-w-sm'
        : 'grid grid-cols-2 gap-6 w-full';
      paintOptions();
    }

    sel.addEventListener('change', () => {
      const v = sel.value;
      if (v && related.indexOf(v) === -1) related.push(v);
      sel.value = '';
      paintRelated();
    });

    /* ─────────── Sign modal ─────────── */
    const SignModal = (function () {
      const backdrop = document.getElementById('sign-modal-backdrop');
      const canvas = document.getElementById('sign-canvas');
      const ctx = canvas.getContext('2d');
      let drawing = false, currentBox = null;
      const uploads = new Map();
      const sigData = {};   /* data-sign-key → dataURL (ใช้บันทึกลงเอกสาร) */

      function remember(box, url) {
        const k = box.getAttribute('data-sign-key');
        if (!k) return;
        if (url) sigData[k] = url; else delete sigData[k];
      }

      function resizeCanvas() {
        const r = canvas.parentElement.getBoundingClientRect();
        if (!r.width) return;
        canvas.width = r.width; canvas.height = r.height;
        ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 2;
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      }

      function resetTabs() {
        document.querySelectorAll('.sign-modal-tab').forEach(t => {
          t.classList.remove('text-blue-600', 'border-blue-600');
          t.classList.add('text-slate-400', 'border-transparent');
        });
        const d = document.querySelector('[data-sign-tab="draw"]');
        d.classList.add('text-blue-600', 'border-blue-600');
        d.classList.remove('text-slate-400', 'border-transparent');
        ['upload', 'sigfile'].forEach(id => document.getElementById('sign-tab-' + id).classList.add('hidden'));
        document.getElementById('sign-tab-draw').classList.remove('hidden');
      }

      function open(box) {
        currentBox = box;
        backdrop.classList.remove('hidden');
        resetTabs();
        /* สำคัญ: ต้อง resize หลังกล่องแสดงผลแล้ว มิฉะนั้นเส้นจะเพี้ยน */
        requestAnimationFrame(resizeCanvas);
      }
      function close() { backdrop.classList.add('hidden'); }

      function bind(btn) {
        btn.addEventListener('click', () => open(btn.closest('.sign-box')));
      }

      document.querySelectorAll('[data-sign-btn]').forEach(bind);
      document.getElementById('sign-modal-cancel').addEventListener('click', close);
      backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

      document.querySelectorAll('.sign-modal-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.sign-modal-tab').forEach(t => {
            t.classList.remove('text-blue-600', 'border-blue-600');
            t.classList.add('text-slate-400', 'border-transparent');
          });
          tab.classList.add('text-blue-600', 'border-blue-600');
          tab.classList.remove('text-slate-400', 'border-transparent');
          ['draw', 'upload', 'sigfile'].forEach(id => document.getElementById('sign-tab-' + id).classList.add('hidden'));
          document.getElementById('sign-tab-' + tab.dataset.signTab).classList.remove('hidden');
          if (tab.dataset.signTab === 'draw') requestAnimationFrame(resizeCanvas);
        });
      });

      function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      canvas.addEventListener('pointerdown', e => { drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      canvas.addEventListener('pointerup', () => drawing = false);
      canvas.addEventListener('pointerleave', () => drawing = false);
      document.getElementById('sign-clear-btn').addEventListener('click', () => ctx.clearRect(0, 0, canvas.width, canvas.height));

      const BIN = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path></svg>';

      function reset(box) {
        box.innerHTML = '<button type="button" data-sign-btn class="rounded-xl px-6 py-2.5 text-sm font-semibold text-white transition-colors" style="background:#4338ca;">' + esc(T('cr.signDoc')) + '</button>';
        bind(box.querySelector('[data-sign-btn]'));
        remember(box, null);
      }

      function showImg(box, url) {
        box.innerHTML =
          '<div class="relative w-full h-full flex items-center justify-center p-4" style="min-height:120px;">' +
            '<img class="max-w-full object-contain" style="max-height:130px;" />' +
            '<div class="absolute top-3 right-3 flex items-center gap-2">' +
              '<button class="change-sig text-[11px] text-blue-500 hover:text-blue-700 underline transition-colors">' + esc(T('act.edit')) + '</button>' +
              '<button class="del-sig w-7 h-7 rounded-lg border border-slate-200 bg-white flex items-center justify-center text-slate-400 hover:text-red-500 hover:border-red-200 transition-colors">' + BIN + '</button>' +
            '</div>' +
          '</div>';
        box.querySelector('img').src = url;
        box.querySelector('.change-sig').addEventListener('click', () => open(box));
        box.querySelector('.del-sig').addEventListener('click', () => reset(box));
        remember(box, url);
      }

      function showLabel(box, name) {
        box.innerHTML =
          '<div class="relative flex flex-col items-center justify-center gap-2 p-4" style="min-height:120px;">' +
            '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4338ca" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
            '<span class="sig-name text-[13px] text-slate-600 font-medium"></span>' +
            '<button class="change-sig text-[11px] text-blue-500 hover:text-blue-700 underline transition-colors">' + esc(T('act.edit')) + '</button>' +
            '<button class="del-sig absolute top-3 right-3 w-7 h-7 rounded-lg border border-slate-200 bg-white flex items-center justify-center text-slate-400 hover:text-red-500 hover:border-red-200 transition-colors">' + BIN + '</button>' +
          '</div>';
        box.querySelector('.sig-name').textContent = name;
        box.querySelector('.change-sig').addEventListener('click', () => open(box));
        box.querySelector('.del-sig').addEventListener('click', () => reset(box));
      }

      document.getElementById('sign-modal-confirm').addEventListener('click', () => {
        if (!currentBox) { close(); return; }
        const active = document.querySelector('.sign-modal-tab.text-blue-600').dataset.signTab;
        if (active === 'draw') {
          const blank = document.createElement('canvas');
          blank.width = canvas.width; blank.height = canvas.height;
          if (canvas.toDataURL() === blank.toDataURL()) { close(); return; }
          showImg(currentBox, canvas.toDataURL('image/png'));
        } else if (active === 'upload') {
          const li = document.getElementById('sign-upload-list').firstElementChild;
          if (li && uploads.get(li)) showImg(currentBox, uploads.get(li));
        } else {
          const c = document.querySelector('input[name="sig-select"]:checked');
          if (c) showLabel(currentBox, c.parentElement.querySelector('span').textContent);
        }
        close();
      });

      const sfi = document.getElementById('sign-file-input');
      sfi.addEventListener('change', () => {
        Array.from(sfi.files).forEach(file => {
          if (file.size > 2 * 1024 * 1024) { App.toast(file.name + ' > 2 MB', 'red'); return; }
          const rd = new FileReader();
          rd.onload = e => {
            const li = document.createElement('li');
            li.className = 'flex items-center gap-3 rounded-xl border border-slate-100 px-4 py-3';
            li.innerHTML =
              '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
              '<span class="flex-1 text-[13px] text-slate-700"></span>' +
              '<button class="del-sig text-slate-300 hover:text-red-500 transition-colors">' + BIN + '</button>';
            li.querySelector('span').textContent = file.name;
            uploads.set(li, e.target.result);
            li.querySelector('.del-sig').addEventListener('click', () => { uploads.delete(li); li.remove(); });
            document.getElementById('sign-upload-list').appendChild(li);
          };
          rd.readAsDataURL(file);
        });
        sfi.value = '';
      });

      return { bind: bind, open: open, data: sigData, restore: showImg };
    })();

    /* ─────────── เก็บค่าจากฟอร์ม ─────────── */
    function collect() {
      const purpose = document.querySelector('input[name="purpose"]:checked');
      const type = document.querySelector('input[name="doctype"]:checked');

      /* ลายเซ็นที่ผู้จัดทำเซ็นตอนสร้างเอกสาร (ส่วนที่ 5) */
      const sig = {};
      ['requester', 'owner'].forEach(k => {
        if (SignModal.data[k]) sig[k] = { by: user.id, day: Store.today(), img: SignModal.data[k] };
      });

      const full = [
        document.getElementById('f-prefix').value || '',
        document.getElementById('f-fname').value.trim(),
        document.getElementById('f-lname').value.trim()
      ].filter(Boolean).join(' ').trim();

      return {
        requesterName: full,
        empId: document.getElementById('f-empid').value.trim(),
        requestDate: document.getElementById('f-date').value.trim(),
        signatures: sig,
        title: document.getElementById('f-docname').value.trim(),
        titleEn: document.getElementById('f-docname').value.trim(),
        docNo: document.getElementById('f-docno').value.trim(),
        type: type ? type.value : 'wi',
        purpose: purpose ? purpose.value : 'new',
        purposeDetail: document.getElementById('purpose-detail').value.trim(),
        revision: Number(document.getElementById('f-revision').value || 0),
        description: descArea.value.trim(),
        relatedDept: document.getElementById('f-relateddept').value,
        effectiveDate: document.getElementById('f-effective').value.trim(),
        dept: document.getElementById('f-dept').value,
        files: files,
        stakeholders: related
      };
    }

    function fill() {
      document.getElementById('f-empid').value = editing ? (editing.requesterEmpId || user.empId) : user.empId;
      const src = editing && editing.requesterName ? editing.requesterName : user.name;
      const parts = src.replace(/^นาย |^นาง |^นางสาว /, '').split(' · ').pop().trim().split(/\s+/);
      document.getElementById('f-fname').value = parts[0] || '';
      document.getElementById('f-lname').value = parts.slice(1).join(' ');
      document.getElementById('f-prefix').value = 'นาย';
      document.getElementById('f-dept').value = (editing && editing.requesterDept) || user.dept;
      document.getElementById('f-date').value = (editing && editing.requestDate) || App.dayLabel(Store.today());

      if (editing) {
        /* คืนลายเซ็นที่เคยเซ็นไว้ */
        ['requester', 'owner'].forEach(k => {
          const s = (editing.signatures || {})[k];
          const box = document.querySelector('.sign-box[data-sign-key="' + k + '"]');
          if (s && s.img && box) SignModal.restore(box, s.img);
        });
        document.getElementById('bc-title').textContent = editing.id + ' · ' + T('act.edit');
        document.getElementById('f-docname').value = editing.title;
        document.getElementById('f-docno').value = editing.docNo;
        document.getElementById('f-revision').value = editing.revision;
        document.getElementById('f-relateddept').value = editing.relatedDept || '';
        document.getElementById('f-effective').value = editing.effectiveDate || '';
        document.getElementById('purpose-detail').value = editing.purposeDetail || '';
        descArea.value = editing.description || '';
        const pr = document.querySelector('input[name="purpose"][value="' + editing.purpose + '"]');
        if (pr) pr.checked = true;
        const tr = document.querySelector('input[name="doctype"][value="' + editing.type + '"]');
        if (tr) tr.checked = true;
      }
      paintCounter(); paintFiles(); paintRelated();
    }

    function persist() {
      const data = collect();
      if (!data.title) { App.toast(T('cr.needName'), 'red'); goToStep(4); return null; }
      if (editing) return Store.updateDraft(editing.id, data);
      editing = Store.createDraft(data, user);
      history.replaceState(null, '', 'create.html?id=' + encodeURIComponent(editing.id));
      return editing;
    }

    /* ─────────── ปุ่ม Draft / Send / Preview ─────────── */
    document.getElementById('draft-btn').addEventListener('click', async () => {
      const d = persist();
      if (!d) return;
      const r = await App.confirmDialog({ title: T('cr.savedDraft'), sub: T('cr.savedDraftSub'), tone: 'blue', needNote: true, okText: T('common.confirm') });
      if (!r) return;
      App.toast(T('cr.savedDraft'));
      setTimeout(() => { location.href = 'document.html?id=' + encodeURIComponent(d.id); }, 700);
    });

    document.getElementById('sent-btn').addEventListener('click', async () => {
      const miss = missingItems();
      if (miss.length) {
        App.toast(T('cr.missingHint') + ' — ' + miss.map(function (m) { return T(m.key); }).join(', '), 'red');
        document.getElementById('ready-chip').click();
        return;
      }
      const d = persist();
      if (!d) return;
      const r = await App.confirmDialog({ title: T('act.send'), sub: T('dv.confirmSend'), tone: 'green', needNote: true });
      if (!r) return;
      Store.send(d.id, user, r.note);
      App.toast(T('cr.sentOk'));
      setTimeout(() => { location.href = 'document.html?id=' + encodeURIComponent(d.id); }, 700);
    });

    document.getElementById('preview-btn').addEventListener('click', () => {
      const d = persist();
      if (!d) return;
      location.href = 'document.html?id=' + encodeURIComponent(d.id);
    });


    /* ═══════════════════════════════════════════════════════════
       ผู้จัดทำต้องกรอกงานของตัวเองให้ครบ (ส่วนที่ 1–5.2)
       ก่อนจึงจะกด "ส่งตรวจสอบ" ได้
       ═══════════════════════════════════════════════════════════ */
    function fval(id) {
      const el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }

    const REQUIRED = [
      { step: 1, id: 'f-empid',      key: 'cr.empId',      ok: function () { return !!fval('f-empid'); } },
      { step: 1, id: 'f-fname',      key: 'cr.fname',      ok: function () { return !!fval('f-fname'); } },
      { step: 1, id: 'f-lname',      key: 'cr.lname',      ok: function () { return !!fval('f-lname'); } },
      { step: 1, id: 'f-dept',       key: 'cr.dept',       ok: function () { return !!fval('f-dept'); } },
      { step: 1, id: 'f-date',       key: 'cr.date',       ok: function () { return !!fval('f-date'); } },
      { step: 2, id: 'step-2',       key: 'cr.s2',         ok: function () { return !!document.querySelector('input[name="purpose"]:checked'); } },
      { step: 2, id: 'purpose-detail', key: 'cr.detail',   ok: function () {
          const p = document.querySelector('input[name="purpose"]:checked');
          return !p || p.value !== 'other' || !!fval('purpose-detail'); } },
      { step: 3, id: 'step-3',       key: 'cr.s3',         ok: function () { return !!document.querySelector('input[name="doctype"]:checked'); } },
      { step: 4, id: 'f-docname',    key: 'cr.docName',    ok: function () { return !!fval('f-docname'); } },
      { step: 4, id: 'f-docno',      key: 'cr.docNo',      ok: function () { return !!fval('f-docno'); } },
      { step: 4, id: 'f-relateddept', key: 'cr.relatedDept', ok: function () { return !!fval('f-relateddept'); } },
      { step: 4, id: 'desc-step4',   key: 'cr.desc',       ok: function () { return !!fval('desc-step4'); } },
      { step: 4, id: 'f-effective',  key: 'cr.effective',  ok: function () { return !!fval('f-effective'); } },
      { step: 5, id: 'step-5',       key: 'cr.s5',         ok: function () { return files.length > 0; } },
      { step: 6, id: 'step-6',       key: 'th.requester',  ok: function () { return !!SignModal.data.requester; } },
      { step: 6, id: 'step-6',       key: 'cr.owner',      ok: function () { return !!SignModal.data.owner; } },
      { step: 7, id: 'related-select', key: 'cr.pickRelated', ok: function () { return related.length > 0; } }
    ];

    function missingItems() { return REQUIRED.filter(function (r) { return !r.ok(); }); }

    function paintReady() {
      if (reviewMode) return;
      const miss = missingItems();
      const ok = miss.length === 0;
      const btn = document.getElementById('sent-btn');
      const chip = document.getElementById('ready-chip');
      if (!btn || !chip) return;

      btn.disabled = !ok;
      btn.classList.toggle('opacity-40', !ok);
      btn.classList.toggle('cursor-not-allowed', !ok);

      chip.classList.remove('hidden');
      chip.classList.add('inline-flex');
      if (ok) {
        chip.className = 'inline-flex items-center gap-1.5 rounded-xl px-3 py-2 text-[12.5px] font-semibold bg-emerald-50 text-emerald-600';
        chip.textContent = T('cr.readyToSend');
        chip.title = '';
      } else {
        chip.className = 'inline-flex items-center gap-1.5 rounded-xl px-3 py-2 text-[12.5px] font-semibold bg-amber-50 text-amber-700 hover:bg-amber-100 transition-colors';
        chip.textContent = T('cr.incomplete') + ' · ' + miss.length + ' ' + T('cr.items');
        chip.title = miss.map(function (m) { return T(m.key); }).join(', ');
      }
      chip.dataset.step = ok ? '' : String(miss[0].step);
      chip.dataset.field = ok ? '' : miss[0].id;
    }

    document.getElementById('ready-chip').addEventListener('click', function () {
      const miss = missingItems();
      if (!miss.length) return;
      const first = miss[0];
      if (isViewAll) document.getElementById('step-' + first.step).scrollIntoView({ behavior: 'smooth', block: 'center' });
      else goToStep(first.step);
      const el = document.getElementById(first.id);
      if (el) {
        setTimeout(function () {
          el.classList.add('ring-2', 'ring-red-300');
          if (el.focus) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
          setTimeout(function () { el.classList.remove('ring-2', 'ring-red-300'); }, 2200);
        }, 250);
      }
      App.toast(T('cr.missingHint') + ' — ' + miss.map(function (m) { return T(m.key); }).join(', '), 'amber');
    });

    document.addEventListener('input', paintReady);
    document.addEventListener('change', paintReady);
    document.addEventListener('langchange', paintReady);
    document.getElementById('sign-modal-confirm').addEventListener('click', function () { setTimeout(paintReady, 0); });

    /* ═══════════════════════════════════════════════════════════
       ผู้จัดทำ (requester) — ส่วนที่ 5.3 ผู้อนุมัติ และส่วนที่ 6 QC
       เป็นของบทบาทอื่น จึงล็อกไว้ กรอก/เซ็นไม่ได้
       ═══════════════════════════════════════════════════════════ */
    function lockOtherRoleSections() {
      [['step-8', 'rv.lockApprover'], ['step-9', 'rv.lockQc']].forEach(function (pair) {
        const sec = document.getElementById(pair[0]);
        if (!sec) return;

        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('bg-slate-50', 'cursor-not-allowed');
        });
        sec.querySelectorAll('.sign-box').forEach(function (box) {
          box.classList.add('bg-slate-50');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
          if (!box.querySelector('.lock-note')) {
            const p = document.createElement('p');
            p.className = 'lock-note text-[12.5px] text-slate-400';
            p.setAttribute('data-lock-key', pair[1]);
            p.textContent = T(pair[1]);
            box.appendChild(p);
          }
        });
      });
    }
    document.addEventListener('langchange', function () {
      document.querySelectorAll('.lock-note').forEach(function (p) { p.textContent = T(p.getAttribute('data-lock-key')); });
    });

    /* ═══════════════════════════════════════════════════════════
       โหมดผู้มีส่วนเกี่ยวข้อง — เปิดเอกสารยาวแบบเดียวกับผู้ร้องขอ
       เซ็นได้เฉพาะช่องของตัวเองในส่วนที่ 5.2
       ═══════════════════════════════════════════════════════════ */
    function paintSignSlots() {
      if (!signMode) return;
      const live = Store.getDoc(editing.id) || editing;
      const myKey = 'rel:' + mySlot.id;

      document.querySelectorAll('#related-sign-boxes .sign-box').forEach(function (box) {
        const key = box.getAttribute('data-sign-key') || '';
        const rid = key.replace('rel:', '');
        const slot = (live.stakeholders || []).filter(function (x) { return x.id === rid; })[0];
        const isMine = key === myKey;

        box.querySelectorAll('.slot-note').forEach(function (n) { n.remove(); });

        if (isMine) {
          box.classList.add('ring-2', 'ring-violet-300');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = ''; });
          if (slot && slot.signed) {
            box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
            addNote(box, T('sg.alreadySigned'));
          }
        } else {
          box.classList.add('bg-slate-50');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
          addNote(box, slot && slot.signed ? T('sg.signedBy') : T('sg.waitOther'));
        }
      });

      function addNote(box, text) {
        if (box.querySelector('img')) return;
        const p = document.createElement('p');
        p.className = 'slot-note text-[12.5px] text-slate-400';
        p.textContent = text;
        box.appendChild(p);
      }
    }

    function initSignMode() {
      const doc = editing;
      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');
      bc.textContent = doc.id + ' · ' + T('act.sign');
      document.addEventListener('langchange', function () { bc.textContent = doc.id + ' · ' + T('act.sign'); });

      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      /* หน้ายาวเสมอ */
      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน ยกเว้นกล่องเซ็นของตัวเองใน 5.2 */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-8', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('bg-slate-50', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        const drop = sec.querySelector('#drop-zone');
        if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
      });

      /* 5.2 — ปิดการแก้ไขรายชื่อ แต่ยังเซ็นช่องตัวเองได้ */
      const s7 = document.getElementById('step-7');
      s7.querySelectorAll('input, select, textarea').forEach(function (el) {
        el.disabled = true;
        el.classList.add('bg-slate-50', 'cursor-not-allowed');
      });
      s7.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });

      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-violet-100 bg-violet-50 px-4 py-3 text-[12.5px] text-violet-700';
      hint.textContent = T('sg.hint');
      s7.insertBefore(hint, s7.firstChild);

      paintSignSlots();

      /* แถบล่าง: Preview PDF + ปุ่มเซ็น */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="sg-sign" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" style="background:linear-gradient(90deg,#8b5cf6 0%,#6d28d9 100%);box-shadow:0 4px 10px rgba(109,40,217,.28)">' + esc(T('act.sign')) + '</button>';

      document.getElementById('sg-sign').addEventListener('click', async function () {
        const key = 'rel:' + mySlot.id;
        if (!SignModal.data[key]) {
          App.toast(T('sg.needSign'), 'red');
          document.getElementById('step-7').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        const r = await App.confirmDialog({ title: T('act.sign'), sub: T('dv.confirmSign'), tone: 'violet', needNote: true });
        if (!r) return;

        const d = Store.sign(doc.id, user, r.note);

        /* เก็บภาพลายเซ็นไว้กับช่องของตัวเอง */
        const live = Store.getDoc(doc.id);
        (live.stakeholders || []).forEach(function (x) { if (x.id === mySlot.id) x.sigImg = SignModal.data[key]; });
        Store.save();

        App.toast(d.status === Store.STATUS.SENT_TO_QC ? T('n.allSigned') : T('n.signed'));
        setTimeout(function () { location.href = 'role-stakeholder.html'; }, 700);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       โหมดผู้อนุมัติ "ตรวจสอบ" — เห็นเอกสารยาวเหมือนหน้าผู้ร้องขอ
       อ่านอย่างเดียวทุกส่วน ยกเว้น 5.2 (เลือกผู้เกี่ยวข้อง) และ 5.3 (เซ็น)
       ═══════════════════════════════════════════════════════════ */
    function initReviewMode() {
      const doc = editing;
      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');                 /* กัน i18n เขียนทับ */
      bc.textContent = doc.id + ' · ' + T('act.review');
      document.addEventListener('langchange', function () { bc.textContent = doc.id + ' · ' + T('act.review'); });

      /* เมนูซ้าย: ไฮไลต์ "งานของฉัน" แทน "สร้างเอกสาร" */
      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      /* หน้ายาวเสมอ แล้วซ่อนปุ่มสลับมุมมอง */
      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน (รวม 5.2 ที่ผู้ร้องขอเลือกมาแล้ว) เหลือทำงานได้เฉพาะ 5.3 */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-7', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('bg-slate-50', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        const drop = sec.querySelector('#drop-zone');
        if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
      });

      /* 5.2 — แสดงรายชื่อที่ผู้ร้องขอเลือกไว้แบบอ่านอย่างเดียว */
      function lockRelated() {
        const s7 = document.getElementById('step-7');
        s7.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });
        s7.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('bg-slate-50', 'cursor-not-allowed');
        });
        s7.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
      }
      lockRelated();
      document.addEventListener('langchange', function () { setTimeout(lockRelated, 0); });

      /* ชี้ว่าต้องทำอะไรต่อ */
      const s8 = document.getElementById('step-8');
      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-[12.5px] text-blue-700';
      hint.textContent = T('rv.hint');
      s8.insertBefore(hint, s8.firstChild);

      /* ── แถบล่าง: Preview PDF (ฟังก์ชัน) + ส่งกลับ + ไม่อนุมัติ + อนุมัติ ── */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="rv-return" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-amber-200 bg-amber-50 px-5 py-2.5 text-sm font-semibold text-amber-700 hover:bg-amber-100 transition-colors">' + esc(T('act.return')) + '</button>' +
        '<button id="rv-reject" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 transition-colors">' + esc(T('act.reject')) + '</button>' +
        '<button id="rv-approve" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" style="background:#16a34a;box-shadow:0 4px 10px rgba(22,163,74,.25)">' + esc(T('act.approve')) + '</button>';

      function jumpTo(id) {
        document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      document.getElementById('rv-approve').addEventListener('click', async function () {
        /* ผู้มีส่วนเกี่ยวข้อง (5.2) ผู้ร้องขอเลือกมาตั้งแต่ตอนสร้างเอกสารแล้ว */
        if (!(Store.getDoc(doc.id).stakeholders || []).length) { App.toast(T('rv.noRelated'), 'red'); jumpTo('step-7'); return; }
        if (!SignModal.data.approver) { App.toast(T('rv.needSign'), 'red'); jumpTo('step-8'); return; }

        const r = await App.confirmDialog({ title: T('act.approve'), sub: T('dv.confirmApprove'), tone: 'green', needNote: true });
        if (!r) return;

        /* ใช้รายชื่อผู้เกี่ยวข้องเดิมที่ผู้ร้องขอเลือกไว้ แล้วเปลี่ยนสถานะตาม flow */
        Store.approve(doc.id, user, r.note);

        /* แนบภาพลายเซ็นของผู้อนุมัติ (ส่วนที่ 5.3) */
        const after = Store.getDoc(doc.id);
        after.signatures = Object.assign({}, after.signatures, {
          approver: Object.assign({}, after.signatures.approver, { img: SignModal.data.approver })
        });
        Store.save();

        App.toast(T('n.approved'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });

      document.getElementById('rv-return').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.return'), sub: T('dv.confirmReturn'), tone: 'amber', needNote: true, noteRequired: true });
        if (!r) return;
        Store.returnForEdit(doc.id, user, r.note);
        App.toast(T('n.returned'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });

      document.getElementById('rv-reject').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.reject'), sub: T('dv.confirmReject'), tone: 'red', needNote: true, noteRequired: true });
        if (!r) return;
        Store.reject(doc.id, user, r.note);
        App.toast(T('n.rejected'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });
    }

    /* ─────────── init ─────────── */
    document.addEventListener('langchange', () => { paintCounter(); paintRelated(); });

    /* ให้ทุกการเปลี่ยนแปลงไฟล์แนบ / ผู้เกี่ยวข้อง อัปเดตสถานะปุ่มส่ง */
    const _paintFiles = paintFiles, _paintRelated = paintRelated;
    paintFiles = function () { _paintFiles.apply(null, arguments); paintReady(); };
    paintRelated = function () {
      _paintRelated.apply(null, arguments);
      /* ให้แต่ละกล่องเซ็นของผู้เกี่ยวข้องมีคีย์ประจำตัว rel:<id> */
      const boxes = document.querySelectorAll('#related-sign-boxes .sign-box');
      related.forEach(function (rid, i) { if (boxes[i]) boxes[i].setAttribute('data-sign-key', 'rel:' + rid); });
      paintReady();
      if (signMode) paintSignSlots();
    };

    fill();
    goToStep(1);
    if (reviewMode) initReviewMode();
    else if (signMode) initSignMode();
    else { lockOtherRoleSections(); paintReady(); }
  })();
  </script>

</body>
</html>
