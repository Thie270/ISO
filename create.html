      chip.dataset.step = ok ? '' : String(miss[0].step);
      chip.dataset.field = ok ? '' : miss[0].id;
    }

    document.getElementById('ready-chip').addEventListener('click', function () {
      const miss = missingItems();
      if (!miss.length) return;
      const first = miss[0];
      if (isViewAll) document.getElementById('step-' + first.step).scrollIntoView({ behavior: 'smooth', block: 'center' });
      else goToStep(first.step);
      const el = document.getElementById(first.id);
      if (el) {
        setTimeout(function () {
          el.classList.add('ring-2', 'ring-red-300');
          if (el.focus) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
          setTimeout(function () { el.classList.remove('ring-2', 'ring-red-300'); }, 2200);
        }, 250);
      }
      App.toast(T('cr.missingHint') + ' — ' + miss.map(function (m) { return T(m.key); }).join(', '), 'amber');
    });

    document.addEventListener('input', paintReady);
    document.addEventListener('change', paintReady);
    document.addEventListener('langchange', paintReady);
    document.getElementById('sign-modal-confirm').addEventListener('click', function () {
      setTimeout(function () { paintReady(); paintSignBtn(); paintQcBtn(); paintOwnerBtn(); clearSignWarn(); }, 0);
    });

    /* ═══════════════════════════════════════════════════════════
       เส้นเตือนที่ขอบกล่องเซ็น — ใช้ตอนกดดำเนินการต่อทั้งที่ยังไม่ได้เซ็น
       ═══════════════════════════════════════════════════════════ */
    const WARN_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';

    function markSignWarn(signKey, msgKey) {
      const box = document.querySelector('.sign-box[data-sign-key="' + signKey + '"]');
      if (!box) return;
      box.classList.remove('sign-warn');
      void box.offsetWidth;                     /* รีสตาร์ท animation เมื่อกดซ้ำ */
      box.classList.add('sign-warn');

      let note = box.parentNode.querySelector('.sign-warn-note');
      if (!note) {
        note = document.createElement('p');
        note.className = 'sign-warn-note flex items-center justify-center gap-1.5 text-[12.5px] font-semibold text-red-600';
        note.innerHTML = WARN_ICON + '<span></span>';
        box.parentNode.insertBefore(note, box.nextSibling);
      }
      note.setAttribute('data-warn-key', msgKey);
      note.querySelector('span').textContent = T(msgKey);
    }

    function clearSignWarn() {
      document.querySelectorAll('.sign-box.sign-warn').forEach(function (b) { b.classList.remove('sign-warn'); });
      document.querySelectorAll('.sign-warn-note').forEach(function (n) { n.remove(); });
    }

    document.addEventListener('langchange', function () {
      document.querySelectorAll('.sign-warn-note').forEach(function (n) {
        n.querySelector('span').textContent = T(n.getAttribute('data-warn-key'));
      });
    });

    /* ═══════════════════════════════════════════════════════════
       ผู้จัดทำ (requester) — ส่วนที่ 5.3 ผู้อนุมัติ และส่วนที่ 6 QC
       เป็นของบทบาทอื่น จึงล็อกไว้ กรอก/เซ็นไม่ได้
       ═══════════════════════════════════════════════════════════ */
    /* ล็อกกล่องเซ็นเฉพาะช่อง — ใช้กับช่องที่เป็นของบทบาทอื่นแต่อยู่ในส่วนเดียวกัน */
    function lockSignBox(key, noteKey) {
      const box = document.querySelector('.sign-box[data-sign-key="' + key + '"]');
      if (!box) return;
      box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
      box.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
      lockSignMeta(key, true);
      if (box.querySelector('img')) return;
      box.classList.add('bg-slate-50');
      if (!box.querySelector('.lock-note')) {
        const p = document.createElement('p');
        p.className = 'lock-note text-[12.5px] text-slate-400';
        p.setAttribute('data-lock-key', noteKey);
        p.textContent = T(noteKey);
        box.appendChild(p);
      }
    }

    function lockOtherRoleSections() {
      /* ช่องหน่วยงานเจ้าของเอกสารในส่วนที่ 5 — บทบาทอื่นลงนามให้ไม่ได้ */
      lockSignBox('owner', 'ow.lockOwner');
      [['step-8', 'rv.lockApprover'], ['step-9', 'rv.lockQc']].forEach(function (pair) {
        const sec = document.getElementById(pair[0]);
        if (!sec) return;

        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        sec.querySelectorAll('.sign-box').forEach(function (box) {
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
          box.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
          /* ถ้าบทบาทนั้นเซ็นมาแล้ว ให้เห็นลายเซ็นจริง ไม่ต้องขึ้นข้อความว่าล็อกไว้ */
          if (box.querySelector('img')) return;
          box.classList.add('bg-slate-50');
          if (!box.querySelector('.lock-note')) {
            const p = document.createElement('p');
            p.className = 'lock-note text-[12.5px] text-slate-400';
            p.setAttribute('data-lock-key', pair[1]);
            p.textContent = T(pair[1]);
            box.appendChild(p);
          }
        });
      });
    }
    document.addEventListener('langchange', function () {
      document.querySelectorAll('.lock-note').forEach(function (p) { p.textContent = T(p.getAttribute('data-lock-key')); });
    });

    /* ═══════════════════════════════════════════════════════════
       พรีวิวไฟล์แนบ (PDF / รูปภาพ) — ไฟล์อื่นให้ดาวน์โหลด
       ═══════════════════════════════════════════════════════════ */
    function openFilePreview(f) {
      if (!f) return;
      const url = Store.fileURL(f);
      const kind = Store.fileKind(f);
      const body = document.getElementById('fp-body');
      const bd = document.getElementById('fp-backdrop');

      document.getElementById('fp-name').textContent = f.name;
      document.getElementById('fp-size').textContent = (f.size / 1024).toFixed(1) + ' KB';

      const dl = document.getElementById('fp-download');
      const nt = document.getElementById('fp-newtab');
      if (url) {
        dl.href = url; dl.setAttribute('download', f.name); dl.classList.remove('hidden');
        nt.href = url; nt.classList.remove('hidden');
      } else {
        dl.classList.add('hidden'); nt.classList.add('hidden');
      }

      if (!url) {
        body.innerHTML = '<p class="text-[13.5px] text-slate-400 px-6 text-center">' +
          esc(f.dropped ? T('dv.fileDropped') : T('dv.noFile')) + '</p>';
      } else if (kind === 'image') {
        body.innerHTML = '<img src="' + url + '" alt="" class="max-w-full max-h-full object-contain" />';
      } else if (kind === 'pdf') {
        body.innerHTML = '<iframe src="' + url + '" class="w-full h-full" style="border:0;background:#fff"></iframe>';
      } else {
        body.innerHTML = '<div class="flex flex-col items-center gap-3 px-6 text-center">' +
          '<p class="text-[13.5px] text-slate-500">' + esc(T('dv.noPreview')) + '</p>' +
          '<a href="' + url + '" download="' + esc(f.name) + '" class="rounded-xl bg-blue-600 px-4 py-2 text-[13px] font-semibold text-white no-underline hover:bg-blue-700 transition-colors">' + esc(T('act.download')) + '</a></div>';
      }

      bd.classList.remove('hidden');
      bd.classList.add('flex');
      I18N.apply(bd);
    }

    function closeFilePreview() {
      const bd = document.getElementById('fp-backdrop');
      bd.classList.add('hidden');
      bd.classList.remove('flex');
      document.getElementById('fp-body').innerHTML = '';
    }
    document.getElementById('fp-close').addEventListener('click', closeFilePreview);
    document.getElementById('fp-backdrop').addEventListener('click', function (e) {
      if (e.target === this) closeFilePreview();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !document.getElementById('fp-backdrop').classList.contains('hidden')) closeFilePreview();
    });

    /* ═══════════════════════════════════════════════════════════
       โหมดแผนกควบคุมคุณภาพ — ส่วนที่ 6 แยกเป็น 2 ช่อง 2 บทบาท
       ① เจ้าหน้าที่ควบคุมคุณภาพ ลงนามช่องซ้าย → ส่งต่อผู้จัดการแผนก
       ② ผู้จัดการแผนกควบคุมคุณภาพ ลงนามช่องขวา → ขึ้นทะเบียน
       ═══════════════════════════════════════════════════════════ */
    /* คีย์ช่องเซ็นของบทบาทที่กำลังเปิดหน้าอยู่ */
    const QC_KEY = qcMgrMode ? 'qcManager' : 'qcStaff';

    function paintQcBtn() {
      if (!qcMode && !qcMgrMode) return;
      const btn = document.getElementById('qc-register');
      if (!btn) return;
      const meta = getSignMeta(QC_KEY);
      const ok = !!SignModal.data[QC_KEY] && !!meta.name && !!meta.at;
      const live = Store.getDoc(editing.id) || editing;
      const canAct = live.status === (qcMgrMode ? Store.STATUS.PENDING_QC_MANAGER : Store.STATUS.SENT_TO_QC);
      btn.disabled = !ok || !canAct;
      btn.classList.toggle('opacity-40', btn.disabled);
      btn.classList.toggle('cursor-not-allowed', btn.disabled);
      btn.textContent = !canAct
        ? T('qc.btnDone')
        : (ok ? (qcMgrMode ? T('act.register') : T('act.qcStaffSign'))
              : (qcMgrMode ? T('qm.btnWait') : T('qc.btnStaffWait')));
    }

    function initQcMode() {
      const doc = editing;
      const homeUrl = qcMgrMode ? 'role-qc-manager.html' : 'role-qc.html';
      const titleKey = qcMgrMode ? 'act.register' : 'act.sign';

      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');
      const paintBc = function () { bc.textContent = doc.id + ' · ' + T(titleKey); };
      paintBc();
      document.addEventListener('langchange', paintBc);

      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน ยกเว้นช่องของตัวเองในส่วนที่ 6 */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-7', 'step-8', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        /* ลายเซ็นของบทบาทอื่น: ดูได้อย่างเดียว แก้/ลบไม่ได้ */
        sec.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
        sec.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });
        const drop = sec.querySelector('#drop-zone');
        if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
      });

      /* ช่องของอีกบทบาทหนึ่งในส่วนที่ 6 — ล็อกไว้พร้อมบอกว่าใครเป็นผู้ลงนาม */
      lockSignBox(qcMgrMode ? 'qcStaff' : 'qcManager', qcMgrMode ? 'qc.lockStaff' : 'qc.lockManager');

      /* เปิดช่องของตัวเอง */
      const box = document.querySelector('.sign-box[data-sign-key="' + QC_KEY + '"]');
      if (box) {
        box.classList.add('ring-2', 'ring-teal-300');
        box.classList.remove('bg-slate-50');
        box.querySelectorAll('.lock-note').forEach(function (n) { n.remove(); });
        box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = ''; });
        lockSignMeta(QC_KEY, false);
      }

      const s9 = document.getElementById('step-9');
      const hintKey = qcMgrMode ? 'qm.hint' : 'qc.hintStaff';
      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-teal-100 bg-teal-50 px-4 py-3 text-[12.5px] text-teal-700 w-full';
      hint.textContent = T(hintKey);
      s9.insertBefore(hint, s9.firstChild);
      document.addEventListener('langchange', function () { hint.textContent = T(hintKey); });

      /* แถบล่าง: Preview PDF + ปุ่มของบทบาทนั้น */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="qc-return" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-amber-200 bg-amber-50 px-5 py-2.5 text-sm font-semibold text-amber-700 hover:bg-amber-100 transition-colors">' + esc(T('act.qcReturn')) + '</button>' +
        '<button id="qc-register" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" ' +
        'style="background:linear-gradient(90deg,#34d399 0%,#16a34a 100%);box-shadow:0 4px 10px rgba(22,163,74,.28)"></button>';
      paintQcBtn();
      document.addEventListener('langchange', paintQcBtn);
      document.addEventListener('input', paintQcBtn);
      document.addEventListener('change', paintQcBtn);

      document.getElementById('qc-register').addEventListener('click', async function () {
        const needKey = qcMgrMode ? 'qm.needSign' : 'qc.needStaffSign';
        if (!SignModal.data[QC_KEY]) {
          markSignWarn(QC_KEY, needKey);
          App.toast(T(needKey), 'red');
          document.getElementById('step-9').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        const meta = getSignMeta(QC_KEY);
        if (!meta.name || !meta.at) {
          App.toast(T('cr.missingHint') + ' — ' + T('cr.name') + ' / ' + T('cr.signDate'), 'red');
          document.getElementById('step-9').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        clearSignWarn();

        const r = await App.confirmDialog({
          title: qcMgrMode ? T('act.register') : T('act.qcStaffSign'),
          sub: qcMgrMode ? T('qc.confirmRegister') : T('qc.confirmStaffSign'),
          tone: 'green', needNote: true });
        if (!r) return;

        if (qcMgrMode) Store.register(doc.id, user, r.note);
        else Store.qcStaffSign(doc.id, user, r.note);

        const live = Store.getDoc(doc.id);
        const patch = {};
        patch[QC_KEY] = Object.assign({}, live.signatures[QC_KEY], {
          img: SignModal.data[QC_KEY], name: meta.name, at: meta.at, position: meta.position
        });
        live.signatures = Object.assign({}, live.signatures, patch);
        Store.save();

        App.toast(qcMgrMode ? T('n.registered') : T('n.qcStaffSigned'));
        setTimeout(function () { location.href = homeUrl; }, 700);
      });

      document.getElementById('qc-return').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.qcReturn'), sub: T('dv.confirmReturn'), tone: 'amber', needNote: true, noteRequired: true });
        if (!r) return;
        Store.returnForEdit(doc.id, user, r.note);
        App.toast(T('n.returned'));
        setTimeout(function () { location.href = homeUrl; }, 700);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       โหมดผู้มีส่วนเกี่ยวข้อง — เปิดเอกสารยาวแบบเดียวกับผู้ร้องขอ
       เซ็นได้เฉพาะช่องของตัวเองในส่วนที่ 5.2
       ═══════════════════════════════════════════════════════════ */
    function paintSignSlots() {
      if (!signMode) return;
      const live = Store.getDoc(editing.id) || editing;
      const myKey = 'rel:' + mySlot.id;

      document.querySelectorAll('#related-sign-boxes .sign-box').forEach(function (box) {
        const key = box.getAttribute('data-sign-key') || '';
        const rid = key.replace('rel:', '');
        const slot = (live.stakeholders || []).filter(function (x) { return x.id === rid; })[0];
        const isMine = key === myKey;

        box.querySelectorAll('.slot-note').forEach(function (n) { n.remove(); });

        if (isMine) {
          box.classList.add('ring-2', 'ring-violet-300');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = ''; });
          /* ช่องของตัวเอง: กรอกชื่อ/วันที่ได้ */
          lockSignMeta(key, !!(slot && slot.signed));
          if (slot && slot.signed) {
            box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
            box.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
            addNote(box, T('sg.alreadySigned'));
          }
        } else {
          box.classList.add('bg-slate-50');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
          box.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
          lockSignMeta(key, true);
          addNote(box, slot && slot.signed ? T('sg.signedBy') : T('sg.waitOther'));
        }
      });

      paintSignBtn();

      function addNote(box, text) {
        if (box.querySelector('img')) return;
        const p = document.createElement('p');
        p.className = 'slot-note text-[12.5px] text-slate-400';
        p.textContent = text;
        box.appendChild(p);
      }
    }

    /* ปุ่มล่างของผู้เกี่ยวข้อง — เปิดใช้งานเมื่อเซ็นช่องตัวเองแล้วเท่านั้น */
    function paintSignBtn() {
      if (!signMode) return;
      const btn = document.getElementById('sg-sign');
      if (!btn) return;

      const live = Store.getDoc(editing.id) || editing;
      const meta = getSignMeta('rel:' + mySlot.id);
      const signedHere = !!SignModal.data['rel:' + mySlot.id] && !!meta.name && !!meta.at;
      const others = (live.stakeholders || []).filter(function (x) { return x.id !== mySlot.id && !x.signed; }).length;

      btn.disabled = !signedHere;
      btn.classList.toggle('opacity-40', !signedHere);
      btn.classList.toggle('cursor-not-allowed', !signedHere);
      btn.textContent = !signedHere
        ? T('sg.btnWait')
        : (others > 0 ? T('sg.btnForward') : T('sg.btnQc'));
    }

    /* ═══════════════════════════════════════════════════════════
       โหมดติดตามสถานะ (ผู้ร้องขอ) — คำขอที่ส่งออกไปแล้ว
       เห็น "งานที่ทำ" ทั้งฉบับเหมือนตอนกรอก แต่แก้ไขไม่ได้
       ดูเป็น PDF ได้จากปุ่ม "พรีวิว" ที่แถบล่าง
       ═══════════════════════════════════════════════════════════ */
    function initTrackMode() {
      const doc = editing;

      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');
      const paintBc = function () { bc.textContent = doc.id + ' · ' + T('act.track'); };
      paintBc();
      document.addEventListener('langchange', paintBc);

      /* เมนูซ้าย: ไฮไลต์ "งานของฉัน" แทน "สร้างเอกสาร" */
      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      /* หน้ายาวเสมอ แล้วซ่อนปุ่มสลับมุมมอง */
      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทั้งฉบับ */
      function lockAll() {
        for (let i = 1; i <= totalSteps; i++) {
          const sec = document.getElementById('step-' + i);
          if (!sec) continue;
          sec.querySelectorAll('input, select, textarea').forEach(function (el) {
            el.disabled = true;
            el.classList.add('is-locked', 'cursor-not-allowed');
          });
          sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        /* ลายเซ็นของบทบาทอื่น: ดูได้อย่างเดียว แก้/ลบไม่ได้ */
        sec.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
          sec.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });
          const drop = sec.querySelector('#drop-zone');
          if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
        }
      }
      lockAll();
      document.addEventListener('langchange', function () { setTimeout(lockAll, 0); });

      /* ส่วนที่ 5.2 — บอกว่าใครเซ็นแล้ว ใครยังรออยู่ */
      function paintTrackSlots() {
        const live = Store.getDoc(doc.id) || doc;
        document.querySelectorAll('#related-sign-boxes .sign-box').forEach(function (box) {
          const rid = (box.getAttribute('data-sign-key') || '').replace('rel:', '');
          const slot = (live.stakeholders || []).filter(function (x) { return x.id === rid; })[0];
          box.classList.add('is-locked');
          box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
          box.querySelectorAll('.slot-note').forEach(function (n) { n.remove(); });
          if (box.querySelector('img')) return;
          const p = document.createElement('p');
          p.className = 'slot-note text-[12.5px] ' + (slot && slot.signed ? 'text-emerald-600' : 'text-slate-400');
          p.textContent = slot && slot.signed ? T('sg.signedBy') : T('sg.waitOther');
          box.appendChild(p);
        });
      }
      paintTrackSlots();
      document.addEventListener('langchange', function () { setTimeout(paintTrackSlots, 0); });

      /* แถบบอกสถานะ + หมายเหตุจากผู้ตรวจ (ถ้ามี) */
      const banner = document.createElement('div');
      banner.className = 'flex flex-col gap-2 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3';
      function paintBanner() {
        const live = Store.getDoc(doc.id) || doc;
        const st = Store.STATUS;
        const inFlight = [st.PENDING_APPROVAL, st.PENDING_SIGN, st.SENT_TO_QC].indexOf(live.status) !== -1;
        let sub = esc(T('holder.' + live.status));
        if (inFlight) {
          sub = esc(T('tk.waiting')) + ' ' + sub +
            (live.status === st.PENDING_SIGN
              ? ' · ' + esc(Store.signedCount(live) + '/' + Store.totalSigners(live))
              : '');
        }
        banner.innerHTML =
          '<div class="flex flex-wrap items-center gap-3">' + App.statusPill(live.status) +
            '<span class="text-[12.5px] text-slate-500">' + sub + '</span></div>' +
          '<p class="text-[12.5px] text-slate-500 leading-relaxed">' + esc(T('tk.hint')) + '</p>' +
          (live.lastRemark
            ? '<p class="rounded-lg border border-amber-100 bg-amber-50 px-3 py-2 text-[12.5px] text-amber-700 leading-relaxed">' +
              '<span class="font-semibold">' + esc(T('tk.remark')) + ':</span> ' + esc(live.lastRemark) + '</p>'
            : '');
      }
      paintBanner();
      document.addEventListener('langchange', paintBanner);
      const s1 = document.getElementById('step-1');
      s1.insertBefore(banner, s1.firstChild);

      /* แถบล่าง: เหลือแค่ปุ่มพรีวิว PDF (ไม่มีบันทึกร่าง / ส่งตรวจสอบ) */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<a href="' + esc(user.home) + '" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-slate-600 no-underline hover:bg-slate-50 transition-colors" data-i18n="common.back"></a>';
      I18N.apply(bar);
    }

    function initSignMode() {
      const doc = editing;
      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');
      bc.textContent = doc.id + ' · ' + T('act.sign');
      document.addEventListener('langchange', function () { bc.textContent = doc.id + ' · ' + T('act.sign'); });

      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      /* หน้ายาวเสมอ */
      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน ยกเว้นกล่องเซ็นของตัวเองใน 5.2 */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-8', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        /* ลายเซ็นของบทบาทอื่น: ดูได้อย่างเดียว แก้/ลบไม่ได้ */
        sec.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
        const drop = sec.querySelector('#drop-zone');
        if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
      });

      /* 5.2 — ปิดการแก้ไขรายชื่อ แต่ยังเซ็นช่องตัวเองได้ */
      const s7 = document.getElementById('step-7');
      s7.querySelectorAll('input, select, textarea').forEach(function (el) {
        el.disabled = true;
        el.classList.add('is-locked', 'cursor-not-allowed');
      });
      s7.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });

      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-violet-100 bg-violet-50 px-4 py-3 text-[12.5px] text-violet-700';
      hint.textContent = T('sg.hint');
      s7.insertBefore(hint, s7.firstChild);

      paintSignSlots();

      /* แถบล่าง: Preview PDF + ปุ่มเซ็น */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="sg-sign" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" ' +
        'style="background:linear-gradient(90deg,#34d399 0%,#16a34a 100%);box-shadow:0 4px 10px rgba(22,163,74,.28)"></button>';
      paintSignBtn();
      document.addEventListener('langchange', paintSignBtn);

      document.getElementById('sg-sign').addEventListener('click', async function () {
        const key = 'rel:' + mySlot.id;
        if (!SignModal.data[key]) {
          markSignWarn(key, 'sg.needSign');
          App.toast(T('sg.needSign'), 'red');
          document.getElementById('step-7').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        clearSignWarn();
        const r = await App.confirmDialog({ title: T('act.sign'), sub: T('dv.confirmSign'), tone: 'violet', needNote: true });
        if (!r) return;

        const d = Store.sign(doc.id, user, r.note);

        /* เก็บภาพลายเซ็น + ชื่อผู้ลงนาม + วันที่ ไว้กับช่องของตัวเอง
           เพื่อให้บทบาทอื่นเปิดเอกสารแล้วเห็นครบ */
        const meta = getSignMeta(key);
        const live = Store.getDoc(doc.id);
        (live.stakeholders || []).forEach(function (x) {
          if (x.id !== mySlot.id) return;
          x.sigImg = SignModal.data[key];
          x.signName = meta.name;
          x.signAt = meta.at;
          x.signPosition = meta.position;
        });
        Store.save();

        App.toast(d.status === Store.STATUS.SENT_TO_QC ? T('n.allSigned') : T('n.signed'));
        setTimeout(function () { location.href = 'role-stakeholder.html'; }, 700);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       โหมดหน่วยงานเจ้าของเอกสาร — เปิดเอกสารยาวแบบเดียวกับผู้ร้องขอ
       อ่านอย่างเดียวทุกส่วน ลงนามได้เฉพาะช่องของตัวเองในส่วนที่ 5
       ═══════════════════════════════════════════════════════════ */
    function paintOwnerBtn() {
      if (!ownerMode) return;
      const btn = document.getElementById('ow-sign');
      if (!btn) return;
      const meta = getSignMeta('owner');
      const ok = !!SignModal.data.owner && !!meta.name && !!meta.at;
      const canSign = (Store.getDoc(editing.id) || editing).status === Store.STATUS.PENDING_OWNER;
      btn.disabled = !ok || !canSign;
      btn.classList.toggle('opacity-40', btn.disabled);
      btn.classList.toggle('cursor-not-allowed', btn.disabled);
      btn.textContent = !canSign ? T('sg.alreadySigned') : (ok ? T('act.ownerSign') : T('ow.btnWait'));
    }

    function initOwnerMode() {
      const doc = editing;
      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');
      const paintBc = function () { bc.textContent = doc.id + ' · ' + T('act.sign'); };
      paintBc();
      document.addEventListener('langchange', paintBc);

      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน — ส่วนที่ 5 จะเปิดเฉพาะช่องของตัวเองทีหลัง */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-7', 'step-8', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        /* ลายเซ็นของบทบาทอื่น: ดูได้อย่างเดียว แก้/ลบไม่ได้ */
        sec.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
        sec.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });
      });

      /* เปิดเฉพาะช่อง "หน่วยงานเจ้าของเอกสาร" ในส่วนที่ 5 */
      const box = document.querySelector('.sign-box[data-sign-key="owner"]');
      if (box) {
        box.classList.add('ring-2', 'ring-blue-300');
        box.classList.remove('bg-slate-50');
        box.querySelectorAll('.lock-note').forEach(function (n) { n.remove(); });
        box.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = ''; });
        lockSignMeta('owner', false);
      }

      const s6 = document.getElementById('step-6');
      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-[12.5px] text-blue-700 w-full';
      hint.setAttribute('data-hint-key', 'ow.hint');
      hint.textContent = T('ow.hint');
      s6.insertBefore(hint, s6.firstChild);
      document.addEventListener('langchange', function () { hint.textContent = T('ow.hint'); });

      /* แถบล่าง: Preview PDF + ส่งกลับ + ลงนามส่งต่อผู้อนุมัติ */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="ow-return" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-amber-200 bg-amber-50 px-5 py-2.5 text-sm font-semibold text-amber-700 hover:bg-amber-100 transition-colors">' + esc(T('act.return')) + '</button>' +
        '<button id="ow-sign" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" ' +
        'style="background:linear-gradient(90deg,#34d399 0%,#16a34a 100%);box-shadow:0 4px 10px rgba(22,163,74,.28)"></button>';
      paintOwnerBtn();
      document.addEventListener('langchange', paintOwnerBtn);
      document.addEventListener('input', paintOwnerBtn);
      document.addEventListener('change', paintOwnerBtn);

      document.getElementById('ow-sign').addEventListener('click', async function () {
        const meta = getSignMeta('owner');
        if (!SignModal.data.owner) {
          markSignWarn('owner', 'ow.needSign');
          App.toast(T('ow.needSign'), 'red');
          document.getElementById('step-6').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        if (!meta.name || !meta.at) {
          App.toast(T('cr.missingHint') + ' — ' + T('cr.name') + ' / ' + T('cr.signDate'), 'red');
          document.getElementById('step-6').scrollIntoView({ behavior: 'smooth', block: 'center' });
          return;
        }
        clearSignWarn();
        const r = await App.confirmDialog({ title: T('act.ownerSign'), sub: T('ow.confirmSign'), tone: 'green', needNote: true });
        if (!r) return;

        Store.ownerSign(doc.id, user, r.note);
        const live = Store.getDoc(doc.id);
        live.signatures = Object.assign({}, live.signatures, {
          owner: Object.assign({}, live.signatures.owner, {
            img: SignModal.data.owner, name: meta.name, at: meta.at, position: meta.position
          })
        });
        Store.save();

        App.toast(T('n.ownerSigned'));
        setTimeout(function () { location.href = 'role-owner.html'; }, 700);
      });

      document.getElementById('ow-return').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.return'), sub: T('dv.confirmReturn'), tone: 'amber', needNote: true, noteRequired: true });
        if (!r) return;
        Store.returnForEdit(doc.id, user, r.note);
        App.toast(T('n.returned'));
        setTimeout(function () { location.href = 'role-owner.html'; }, 700);
      });
    }

    /* ═══════════════════════════════════════════════════════════
       โหมดผู้อนุมัติ "ตรวจสอบ" — เห็นเอกสารยาวเหมือนหน้าผู้ร้องขอ
       อ่านอย่างเดียวทุกส่วน ยกเว้น 5.2 (เลือกผู้เกี่ยวข้อง) และ 5.3 (เซ็น)
       ═══════════════════════════════════════════════════════════ */
    function initReviewMode() {
      const doc = editing;
      const bc = document.getElementById('bc-title');
      bc.removeAttribute('data-i18n');                 /* กัน i18n เขียนทับ */
      bc.textContent = doc.id + ' · ' + T('act.review');
      document.addEventListener('langchange', function () { bc.textContent = doc.id + ' · ' + T('act.review'); });

      /* เมนูซ้าย: ไฮไลต์ "งานของฉัน" แทน "สร้างเอกสาร" */
      document.querySelectorAll('#sidebar .nav-link').forEach(function (a) {
        a.classList.toggle('active', a.hasAttribute('data-my-work'));
      });

      /* หน้ายาวเสมอ แล้วซ่อนปุ่มสลับมุมมอง */
      const viewAllBtn = document.getElementById('view-all-btn');
      viewAllBtn.click();
      viewAllBtn.style.display = 'none';

      /* อ่านอย่างเดียวทุกส่วน (รวม 5.2 ที่ผู้ร้องขอเลือกมาแล้ว) เหลือทำงานได้เฉพาะ 5.3 */
      ['step-1', 'step-2', 'step-3', 'step-4', 'step-5', 'step-6', 'step-7', 'step-9'].forEach(function (id) {
        const sec = document.getElementById(id);
        if (!sec) return;
        sec.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        sec.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        /* ลายเซ็นของบทบาทอื่น: ดูได้อย่างเดียว แก้/ลบไม่ได้ */
        sec.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
        const drop = sec.querySelector('#drop-zone');
        if (drop) drop.classList.add('opacity-60', 'pointer-events-none');
      });

      /* 5.2 — แสดงรายชื่อที่ผู้ร้องขอเลือกไว้แบบอ่านอย่างเดียว */
      function lockRelated() {
        const s7 = document.getElementById('step-7');
        s7.querySelectorAll('#related-chips button').forEach(function (x) { x.style.display = 'none'; });
        s7.querySelectorAll('input, select, textarea').forEach(function (el) {
          el.disabled = true;
          el.classList.add('is-locked', 'cursor-not-allowed');
        });
        s7.querySelectorAll('[data-sign-btn]').forEach(function (b) { b.style.display = 'none'; });
        s7.querySelectorAll('.change-sig, .del-sig').forEach(function (b) { b.remove(); });
      }
      lockRelated();
      document.addEventListener('langchange', function () { setTimeout(lockRelated, 0); });

      /* ชี้ว่าต้องทำอะไรต่อ */
      const s8 = document.getElementById('step-8');
      const hint = document.createElement('div');
      hint.className = 'rounded-xl border border-blue-100 bg-blue-50 px-4 py-3 text-[12.5px] text-blue-700';
      hint.textContent = T('rv.hint');
      s8.insertBefore(hint, s8.firstChild);

      /* ── แถบล่าง: Preview PDF (ฟังก์ชัน) + ส่งกลับ + ไม่อนุมัติ + อนุมัติ ── */
      const oldPreview = document.getElementById('preview-btn');
      const preview = oldPreview.cloneNode(true);
      oldPreview.parentNode.replaceChild(preview, oldPreview);
      preview.addEventListener('click', function () {
        location.href = 'document.html?id=' + encodeURIComponent(doc.id);
      });

      const bar = document.getElementById('draft-btn').parentNode;
      bar.innerHTML =
        '<button id="rv-return" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-amber-200 bg-amber-50 px-5 py-2.5 text-sm font-semibold text-amber-700 hover:bg-amber-100 transition-colors">' + esc(T('act.return')) + '</button>' +
        '<button id="rv-reject" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 transition-colors">' + esc(T('act.reject')) + '</button>' +
        '<button id="rv-approve" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-5 py-2.5 text-sm font-semibold text-white transition-colors" style="background:#16a34a;box-shadow:0 4px 10px rgba(22,163,74,.25)">' + esc(T('act.approve')) + '</button>';

      function jumpTo(id) {
        document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      document.getElementById('rv-approve').addEventListener('click', async function () {
        /* ผู้มีส่วนเกี่ยวข้อง (5.2) ผู้ร้องขอเลือกมาตั้งแต่ตอนสร้างเอกสารแล้ว */
        if (!(Store.getDoc(doc.id).stakeholders || []).length) { App.toast(T('rv.noRelated'), 'red'); jumpTo('step-7'); return; }
        if (!SignModal.data.approver) {
          markSignWarn('approver', 'rv.needSign');
          App.toast(T('rv.needSign'), 'red');
          jumpTo('step-8');
          return;
        }
        /* ต้องมีชื่อผู้ลงนามและวันที่ด้วย มิฉะนั้นบทบาทถัดไปจะเห็นช่องว่าง */
        const meta = getSignMeta('approver');
        if (!meta.name || !meta.at) {
          App.toast(T('cr.missingHint') + ' — ' + T('cr.name') + ' / ' + T('cr.signDate'), 'red');
          jumpTo('step-8');
          const focusEl = document.getElementById(!meta.name ? 's5-name-approver' : 's5-date-approver');
          if (focusEl) focusEl.focus();
          return;
        }
        clearSignWarn();

        const r = await App.confirmDialog({ title: T('act.approve'), sub: T('dv.confirmApprove'), tone: 'green', needNote: true });
        if (!r) return;

        /* ใช้รายชื่อผู้เกี่ยวข้องเดิมที่ผู้ร้องขอเลือกไว้ แล้วเปลี่ยนสถานะตาม flow */
        Store.approve(doc.id, user, r.note);

        /* แนบภาพลายเซ็นของผู้อนุมัติ (ส่วนที่ 5.3) */
        const after = Store.getDoc(doc.id);
        after.signatures = Object.assign({}, after.signatures, {
          approver: Object.assign({}, after.signatures.approver, {
            img: SignModal.data.approver, name: meta.name, at: meta.at, position: meta.position
          })
        });
        Store.save();

        App.toast(T('n.approved'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });

      document.getElementById('rv-return').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.return'), sub: T('dv.confirmReturn'), tone: 'amber', needNote: true, noteRequired: true });
        if (!r) return;
        Store.returnForEdit(doc.id, user, r.note);
        App.toast(T('n.returned'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });

      document.getElementById('rv-reject').addEventListener('click', async function () {
        const r = await App.confirmDialog({ title: T('act.reject'), sub: T('dv.confirmReject'), tone: 'red', needNote: true, noteRequired: true });
        if (!r) return;
        Store.reject(doc.id, user, r.note);
        App.toast(T('n.rejected'));
        setTimeout(function () { location.href = 'role-approver.html'; }, 700);
      });
    }

    /* ─────────── init ─────────── */
    document.addEventListener('langchange', () => { paintCounter(); paintRelated(); });

    /* ให้ทุกการเปลี่ยนแปลงไฟล์แนบ / ผู้เกี่ยวข้อง อัปเดตสถานะปุ่มส่ง */
    const _paintFiles = paintFiles, _paintRelated = paintRelated;
    paintFiles = function () { _paintFiles.apply(null, arguments); paintReady(); };
    paintRelated = function () {
      _paintRelated.apply(null, arguments);
      /* ให้แต่ละกล่องเซ็นของผู้เกี่ยวข้องมีคีย์ประจำตัว rel:<id> */
      const boxes = document.querySelectorAll('#related-sign-boxes .sign-box');
      related.forEach(function (rid, i) { if (boxes[i]) boxes[i].setAttribute('data-sign-key', 'rel:' + rid); });
      paintReady();
      if (signMode) paintSignSlots();
    };

    /* ═══════════════════════════════════════════════════════════
       เอกสารที่ถูกส่งกลับ / ไม่อนุมัติ — ต้องเห็นเหตุผลทันทีที่เปิด
       (เดิมหมายเหตุอยู่แค่ในหน้ารายละเอียด ผู้จัดทำจึงไม่รู้ว่าติดอะไร)
       ═══════════════════════════════════════════════════════════ */
    function showRemarkBanner() {
      if (!editing || !editing.lastRemark) return;
      const st = Store.STATUS;
      if ([st.RETURNED, st.REJECTED, st.EXPIRED_RETURNED].indexOf(editing.status) === -1) return;

      const zone = document.getElementById('doc-zone');
      const tabs = document.getElementById('doc-tabs');
      if (!zone || !tabs || document.getElementById('remark-banner')) return;

      const who = (editing.history || []).slice().reverse()
        .filter(h => ['return', 'reject'].indexOf(h.action) !== -1)[0];
      const actor = who ? (Store.USERS.filter(u => u.id === who.actor)[0] || null) : null;

      const box = document.createElement('div');
      box.id = 'remark-banner';
      box.className = 'flex-shrink-0 flex items-start gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3';
      box.innerHTML =
        '<span class="mt-0.5 text-amber-500 flex-shrink-0">' + WARN_ICON + '</span>' +
        '<div class="min-w-0">' +
          '<p class="text-[12.5px] font-bold text-amber-800"><span data-remark-title></span>' +
            (actor ? ' · <span class="font-semibold">' + esc(I18N.getLang() === 'en' ? actor.nameEn : actor.name) + '</span>' : '') +
          '</p>' +
          '<p class="mt-0.5 text-[12.5px] text-amber-700 leading-relaxed whitespace-pre-wrap">' + esc(editing.lastRemark) + '</p>' +
        '</div>';
      zone.insertBefore(box, tabs);

      const paintTitle = function () {
        box.querySelector('[data-remark-title]').textContent = T('tk.remark');
      };
      paintTitle();
      document.addEventListener('langchange', paintTitle);
    }

    fill();
    goToStep(1);
    showRemarkBanner();
    /* ปุ่มลูกศรของช่องหน่วยงาน ต้องปิดตามโหมดอ่านอย่างเดียวของแต่ละบทบาท */
    document.addEventListener('langchange', function () { setTimeout(syncCombos, 0); });
    setTimeout(syncCombos, 0);
    if (ownerMode) initOwnerMode();
    else if (reviewMode) initReviewMode();
    else if (signMode) initSignMode();
    else if (qcMode || qcMgrMode) initQcMode();
    else if (trackMode) { lockOtherRoleSections(); initTrackMode(); }
    else { lockOtherRoleSections(); paintReady(); }
  })();
  </script>

</body>
</html>
