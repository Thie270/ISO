<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผู้มีส่วนเกี่ยวข้อง — Riverpark Document System</title>
  <link rel="stylesheet" href="style.css" />

</head>

<body class="bg-slate-100 min-h-screen flex" style="font-family:'Inter','IBM Plex Sans Thai',sans-serif;">

  <!-- ════════════════════════════════════════════ SIDEBAR ════════════════════════════════════════════ -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-[260px] bg-white border-r border-slate-100 shadow-sm flex flex-col z-[500] overflow-hidden">

    <div class="sidebar-expanded-header flex items-center gap-3 px-5 border-b border-slate-100" style="height:64px;">

      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-slate-800 truncate leading-tight" data-i18n="app.name"></p>
        <p class="text-[11px] text-slate-400 truncate" data-i18n="app.sub"></p>
      </div>
      <button id="collapse-btn" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0 transition-colors">
        <img src="icon/menu-01.svg" width="20" height="20" alt="" />
      </button>
    </div>

    <div class="sidebar-collapsed-header hidden items-center justify-center border-b border-slate-100" style="height:64px;">
      <button id="expand-btn" class="w-9 h-9 rounded-xl overflow-hidden hover:opacity-80 transition-opacity" data-i18n-title="app.name">
        <img src="image/logo.png" alt="Logo" class="w-full h-full object-cover" />
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-0.5">
      <p class="nav-section-title text-[10px] font-semibold text-slate-300 uppercase tracking-widest px-3 pt-3 pb-1.5" data-i18n="nav.main"></p>
      <a href="index.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
        <span class="nav-text" data-i18n="nav.registry"></span>
      </a>
      <a href="role-stakeholder.html" class="nav-link active">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span class="nav-text" data-i18n="nav.myWork"></span>
      </a>
      <a href="track.html" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span class="nav-text" data-i18n="nav.track"></span>
      </a>

      <div class="flex-1"></div>

      <p class="nav-section-title text-[10px] font-semibold text-slate-300 uppercase tracking-widest px-3 pt-5 pb-1.5" data-i18n="nav.system"></p>
      <a href="#" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><circle cx="12" cy="12" r="3"></circle><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"></path></svg>
        <span class="nav-text" data-i18n="nav.settings"></span>

    </nav>

    <div class="sidebar-expanded-header flex items-center gap-3 px-4 py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <p data-user-name class="text-[13px] font-semibold text-slate-800 truncate leading-tight"></p>

    <div class="sidebar-collapsed-header hidden items-center justify-center py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold"></div>

  </aside>

  <!-- ════════════════════════════════════════════ MAIN ════════════════════════════════════════════ -->
  <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden" style="margin-left:260px;">

    <div class="flex-shrink-0 z-[100] bg-white border-b border-slate-100 flex items-center justify-between px-8" style="height:64px;">
      <div class="flex items-center gap-2 text-[13px] font-medium">
        <a href="index.html" class="text-slate-400 no-underline hover:text-blue-600 transition-colors" data-i18n="common.dashboard"></a>
        <span class="text-slate-300">/</span>
        <span class="text-slate-900 font-semibold" data-i18n="sh.title"></span>
      </div>
      <div class="flex items-center gap-3">
        <span data-role-badge class="hidden lg:inline-flex items-center gap-2 rounded-xl bg-blue-50 px-3 py-2 text-[12.5px] font-semibold text-blue-600"></span>
        <button id="notif-btn" class="relative w-10 h-10 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-400 shadow-sm hover:bg-slate-50 hover:text-blue-600 transition-colors" data-i18n-aria="common.notifications">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <button id="user-btn" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 hover:bg-slate-100 transition-colors cursor-pointer">
          <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[13px] font-bold"></div>
          <span data-user-name class="text-sm font-semibold text-slate-900"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </div>

    <div class="dashboard-bg flex-1 min-h-0 overflow-y-auto flex flex-col">

    <div class="flex-1 px-6 pt-6 pb-6 flex flex-col gap-5">

      <!-- ── Summary cards ── -->
      <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4">
        <div class="rounded-2xl bg-white p-5 border border-slate-100 shadow-[0_2px_14px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_20px_rgba(15,23,42,0.08)]">
          <div class="flex items-start justify-between gap-3">
            <p class="text-[15px] font-semibold text-slate-500" data-i18n="sh.c1"></p>
            <span class="w-9 h-9 rounded-xl bg-violet-50 text-violet-600 flex items-center justify-center flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></span>
          </div>
          <p id="c-wait" class="mt-3 text-[32px] font-bold text-slate-900 leading-none">0</p>
          <p class="mt-3 text-[12.5px] text-slate-400" data-i18n="sh.c1s"></p>
        </div>

        <div class="rounded-2xl bg-white p-5 border border-slate-100 shadow-[0_2px_14px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_20px_rgba(15,23,42,0.08)]">
          <div class="flex items-start justify-between gap-3">
            <p class="text-[15px] font-semibold text-slate-500" data-i18n="sh.c2"></p>
            <span class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 11 15 16 9"></polyline></svg></span>
          </div>
          <p id="c-signed" class="mt-3 text-[32px] font-bold text-slate-900 leading-none">0</p>
          <p class="mt-3 text-[12.5px] text-slate-400" data-i18n="sh.c2s"></p>
        </div>

        <div class="rounded-2xl bg-white p-5 border border-slate-100 shadow-[0_2px_14px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_20px_rgba(15,23,42,0.08)]">
          <div class="flex items-start justify-between gap-3">
            <p class="text-[15px] font-semibold text-slate-500" data-i18n="sh.c3"></p>
            <span class="w-9 h-9 rounded-xl bg-red-50 text-red-500 flex items-center justify-center flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></span>
          </div>
          <p id="c-near" class="mt-3 text-[32px] font-bold text-slate-900 leading-none">0</p>
          <p class="mt-3 text-[12.5px] text-slate-400" data-i18n="sh.c3s"></p>
        </div>

        <div class="rounded-2xl bg-white p-5 border border-slate-100 shadow-[0_2px_14px_rgba(15,23,42,0.05)] transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_8px_20px_rgba(15,23,42,0.08)]">
          <div class="flex items-start justify-between gap-3">
            <p class="text-[15px] font-semibold text-slate-500" data-i18n="sh.c4"></p>
            <span class="w-9 h-9 rounded-xl bg-amber-50 text-amber-500 flex items-center justify-center flex-shrink-0"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></span>
          </div>
          <p id="c-returned" class="mt-3 text-[32px] font-bold text-slate-900 leading-none">0</p>
          <p class="mt-3 text-[12.5px] text-slate-400" data-i18n="sh.c4s"></p>
        </div>
      </div>

      <!-- ── Table Card ── -->
      <div class="rounded-3xl bg-white border border-slate-100 shadow-[0_2px_16px_rgba(15,23,42,0.05)] overflow-hidden">

        <div class="flex flex-col flex-wrap gap-4 p-4 lg:flex-row lg:items-center lg:justify-between">
          <div class="inline-flex flex-wrap items-center gap-1 rounded-2xl border border-slate-200 p-1">
            <button data-filter="waitme" class="filter-tab active rounded-xl px-5 py-2 text-sm font-semibold transition-all duration-200" data-i18n="sh.c1"></button>
            <button data-filter="signed" class="filter-tab rounded-xl px-5 py-2 text-sm font-semibold transition-all duration-200" data-i18n="sh.c2"></button>
            <button data-filter="near" class="filter-tab rounded-xl px-5 py-2 text-sm font-semibold transition-all duration-200" data-i18n="sh.c3"></button>
            <button data-filter="EXPIRED_RETURNED" class="filter-tab rounded-xl px-5 py-2 text-sm font-semibold transition-all duration-200" data-i18n="sh.c4"></button>
            <button data-filter="" class="filter-tab rounded-xl px-5 py-2 text-sm font-semibold transition-all duration-200" data-i18n="common.all"></button>
          </div>
          <div class="flex flex-wrap items-center gap-3">
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-300 pointer-events-none">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <input id="search" type="text" data-i18n-ph="common.search" class="w-[240px] rounded-xl border border-slate-200 pl-9 pr-4 py-2.5 text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/15 transition-all placeholder:text-slate-300" />
            </div>
          </div>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead>
              <tr class="border-y border-slate-100">
                <th class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700 w-16" data-i18n="th.no"></th>
                <th data-sort="id" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700" data-i18n="th.docNo"></th>
                <th data-sort="title" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700" data-i18n="th.docName"></th>
                <th data-sort="requester" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700" data-i18n="th.requester"></th>
                <th data-sort="progress" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700" data-i18n="th.signProgress"></th>
                <th data-sort="status" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700 bg-slate-50/60" data-i18n="th.status"></th>
                <th data-sort="due" class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700 bg-slate-50/60" data-i18n="th.dueDate"></th>
                <th class="px-5 py-4 text-left text-[13.5px] font-semibold text-slate-700 bg-slate-50/60" data-i18n="common.remark"></th>
                <th class="px-5 py-4 text-right text-[13.5px] font-semibold text-slate-700 bg-slate-50/60"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="pager"></div>

        <div class="border-t border-slate-100 px-5 py-3.5 text-[12.5px] text-slate-400 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 text-amber-400"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          <span data-i18n="sh.foot"></span>
        </div>

      </div>
    </div>

    </div><!-- /scroll area -->

  </div><!-- /main-wrapper -->

  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    const esc = App.esc, T = k => I18N.t(k);
    const user = App.initChrome();
    if (!user) return;
    if (user.role !== 'stakeholder') { location.replace(user.home); return; }

    let filter = 'waitme', term = '';

    function paintCards() {
      const s = Store.stats('stakeholder', user.id);
      document.getElementById('c-wait').textContent     = s.waitMe;
      document.getElementById('c-signed').textContent   = s.signed;
      document.getElementById('c-near').textContent     = s.near;
      document.getElementById('c-returned').textContent = s.returned;
    }

    function mine(d) { return Store.mySignSlot(d, user); }

    function matchFilter(d) {
      const st = Store.STATUS, slot = mine(d);
      if (!filter) return true;
      if (filter === 'waitme')  return d.status === st.PENDING_SIGN && slot && !slot.signed;
      if (filter === 'signed')  return slot && slot.signed;
      if (filter === 'near')    return d.status === st.PENDING_SIGN && Store.remainingOf(d) <= 2;
      return d.status === filter;
    }

    function dueCell(d) {
      const st = Store.STATUS;
      if (d.status === st.SENT_TO_QC)
        return '<span class="text-slate-500">' + Store.ageOf(d) + ' ' + esc(T('common.days')) + '</span>';
      if (d.status === st.EXPIRED_RETURNED)
        return '<span class="text-red-500 font-semibold">' + d.dueDays + ' ' + esc(T('common.days')) + '</span>';
      const rem = Store.remainingOf(d);
      const cls = rem <= 1 ? 'text-red-500 font-semibold' : (rem <= 4 ? 'text-amber-600 font-semibold' : 'text-slate-500');
      return '<span class="' + cls + '">' + esc(T('dv.remaining')) + ' ' + Math.max(0, rem) + ' ' + esc(T('common.days')) + '</span>';
    }

    const tableState = App.newTableState('age', 'desc', 10);

    function paintRows() {
      const lang = I18N.getLang();
      const list = Store.docsForRole('stakeholder', user.id).filter(d => {
        if (!matchFilter(d)) return false;
        if (!term) return true;
        const hay = (d.id + ' ' + d.docNo + ' ' + d.title + ' ' + (d.titleEn || '')).toLowerCase();
        return hay.indexOf(term.toLowerCase()) !== -1;
      });

      const info = App.pageOf(list, tableState, lang);

      const pageRows = info.rows;

      const tb = document.getElementById('rows');
      if (!list.length) { tb.innerHTML = App.emptyRow(9); App.paintPager(document.getElementById('pager'), tableState, { total: 0 }, paintRows); return; }

      tb.innerHTML = pageRows.map((d, i) => {
        const slot = mine(d);
        const canSign = d.status === Store.STATUS.PENDING_SIGN && slot && !slot.signed;
        return '<tr class="border-b border-slate-50 hover:bg-slate-50/70 transition-colors duration-150">' +
          '<td class="px-5 py-4 text-slate-500">' + (info.from + i + 1) + '</td>' +
          '<td class="px-5 py-4 font-semibold text-slate-800">' + esc(d.id) + '<span class="block text-[11.5px] font-normal text-slate-400">' + esc(d.docNo) + '</span></td>' +
          '<td class="px-5 py-4 text-slate-700">' + esc(Store.docTitle(d, lang)) + '</td>' +
          '<td class="px-5 py-4 text-slate-600">' + esc(lang === 'en' ? d.requesterNameEn : d.requesterName) + '</td>' +
          '<td class="px-5 py-4">' + App.progressBar(d) + '</td>' +
          '<td class="px-5 py-4 bg-slate-50/60">' +
            (canSign
              ? '<span class="status-pill bg-violet-50 text-violet-600"><span class="dot bg-violet-500"></span>' + esc(T('sh.c1')) + '</span>'
              : App.statusPill(d.status)) + '</td>' +
          '<td class="px-5 py-4 bg-slate-50/60">' + dueCell(d) + '</td>' +
          App.remarkCell(d) +
          '<td class="px-5 py-4 bg-slate-50/60"><div class="flex items-center justify-end gap-2">' +
            (canSign
              ? '<a href="create.html?id=' + encodeURIComponent(d.id) + '" class="row-btn inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl px-4 py-2 text-[13px] font-semibold text-white no-underline transition-colors" style="background:#6d28d9;box-shadow:0 4px 10px rgba(109,40,217,.25)">' +
                esc(T('act.sign')) + '</a>'
              : App.docLink(d, d.status === Store.STATUS.EXPIRED_RETURNED ? T('act.history') : T('act.detail'), false)) +
            '<a href="document.html?id=' + encodeURIComponent(d.id) + '" class="inline-flex items-center gap-1.5 whitespace-nowrap rounded-xl border border-slate-200 bg-white px-3 py-2 text-[13px] font-semibold text-slate-600 no-underline hover:bg-slate-50 transition-colors" title="' + esc(T('dv.pdf')) + '">' + App.IC.eye + '</a>' +
            '<button class="row-action" data-i18n-aria="act.options">' + App.IC.dots + '</button>' +
          '</div></td>' +
        '</tr>';
      }).join('');
      I18N.apply(tb);
      App.paintPager(document.getElementById('pager'), tableState, info, paintRows);
      App.bindSortHeaders(document, tableState, paintRows);

      tb.querySelectorAll('[data-sign]').forEach(b => {
        b.addEventListener('click', async () => {
          const id = b.getAttribute('data-sign');
          const r = await App.confirmDialog({ title: T('act.sign'), sub: T('dv.confirmSign'), tone: 'violet', needNote: true });
          if (!r) return;
          const d = Store.sign(id, user, r.note);
          App.toast(d.status === Store.STATUS.SENT_TO_QC ? T('n.allSigned') : T('n.signed'));
          refresh();
        });
      });
    }

    function refresh() { paintCards(); paintRows(); }

    App.initFilterTabs(f => { filter = f; paintRows(); });
    document.getElementById('search').addEventListener('input', e => { term = e.target.value; paintRows(); });
    document.addEventListener('langchange', refresh);

    refresh();

    /* ตามการเดินงานจริงแบบ real time — บทบาทอื่นขยับสถานะเมื่อไหร่ หน้านี้อัปเดตตาม */
    App.liveRefresh(refresh);
  })();
  </script>

</body>
</html>
