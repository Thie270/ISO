<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายละเอียดเอกสาร — Riverpark</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── กระดาษ A4 ในโปรแกรมดูเอกสาร ── */
    #pdf-stage { background:#525659; }
    #pdf-pages { transform-origin: top center; }
    .paper {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0,0,0,.45);
      margin: 0 auto 22px;
      padding: 16mm 15mm;
      color: #0f172a;
      font-size: 12.5px;
      line-height: 1.55;
      transform-origin: top center;
    }
    .paper h1 { font-size: 17px; font-weight: 700; }
    .paper .ph  { border-bottom: 1px solid #94a3b8; display:inline-block; min-width:120px; }
    .paper table { width:100%; border-collapse: collapse; }
    .paper .bx { border:1px solid #cbd5e1; }
    .paper .sec {
      background:#f1f5f9; border:1px solid #cbd5e1; font-weight:700;
      padding:5px 9px; font-size:12.5px; margin-top:14px;
    }
    .chk { display:inline-flex; width:13px; height:13px; border:1.4px solid #475569; margin-right:6px; align-items:center; justify-content:center; font-size:11px; line-height:1; flex-shrink:0; }
    .chk.on::after { content:'\2713'; font-weight:700; }

    @media print {
      body * { visibility: hidden !important; }
      #pdf-stage, #pdf-stage * { visibility: visible !important; }
      #pdf-stage { position:absolute; inset:0; background:#fff !important; padding:0 !important; overflow:visible !important; }
      #pdf-pages { transform:none !important; margin:0 !important; }
      .paper { box-shadow:none !important; margin:0 !important; page-break-after: always; }
      #demo-bar, #notif-panel { display:none !important; }
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen flex" style="font-family:'Inter','IBM Plex Sans Thai',sans-serif;">

      <button id="collapse-btn" class="w-7 h-7 rounded-lg hover:bg-slate-100 flex items-center justify-center text-slate-400 flex-shrink-0 transition-colors"><img src="icon/menu-01.svg" width="20" height="20" alt="" /></button>

    <div class="sidebar-collapsed-header hidden items-center justify-center border-b border-slate-100" style="height:64px;">

    <nav class="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-0.5">

        <span class="nav-text" data-i18n="nav.create"></span>
      </a>
      <div class="flex-1"></div>
      <p class="nav-section-title text-[10px] font-semibold text-slate-300 uppercase tracking-widest px-3 pt-5 pb-1.5" data-i18n="nav.system"></p>
      <a href="#" class="nav-link">

        <span class="nav-text" data-i18n="nav.settings"></span>

    <div class="sidebar-expanded-header flex items-center gap-3 px-4 py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold flex-shrink-0"></div>
      <div class="flex-1 min-w-0">
        <p data-user-name class="text-[13px] font-semibold text-slate-800 truncate leading-tight"></p>
        <p data-user-rolesub class="text-[11px] text-slate-400 truncate"></p>

    <div class="sidebar-collapsed-header hidden items-center justify-center py-4 border-t border-slate-100">
      <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[11px] font-bold"></div>

  <!-- ════════════════════════════════════════════ MAIN ════════════════════════════════════════════ -->
  <div id="main-wrapper" class="flex-1 flex flex-col h-screen overflow-hidden" style="margin-left:260px;">

    <!-- Topbar -->
    <div class="flex-shrink-0 z-[100] bg-white border-b border-slate-100 flex items-center justify-between px-8" style="height:64px;">
      <div class="flex items-center gap-2 text-[13px] font-medium min-w-0">

      <div class="flex items-center gap-3">

          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </button>
        <button id="user-btn" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 hover:bg-slate-100 transition-colors cursor-pointer">
          <div data-user-initials class="w-8 h-8 rounded-lg text-white flex items-center justify-center text-[13px] font-bold"></div>
          <span data-user-name class="text-sm font-semibold text-slate-900 hidden sm:inline"></span>
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>

    <!-- Body -->
    <div class="flex-1 min-h-0 flex">

      <!-- ── PDF VIEWER ── -->
      <div class="flex-1 min-w-0 flex flex-col">

        <!-- viewer toolbar -->
        <div class="flex-shrink-0 bg-white border-b border-slate-100 flex items-center justify-between gap-3 px-5 py-2.5 flex-wrap">
          <div class="inline-flex items-center gap-1 rounded-xl border border-slate-200 p-1">
            <button data-vtab="dar" class="v-tab rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold transition-colors bg-blue-600 text-white" data-i18n="dv.pdf"></button>
            <button data-vtab="files" class="v-tab rounded-lg px-3.5 py-1.5 text-[12.5px] font-semibold text-slate-500 transition-colors hover:bg-slate-100">
              <span data-i18n="dv.attach"></span> <span id="files-count" class="opacity-60"></span>
            </button>
          </div>

          <div class="flex items-center gap-1.5">
            <button id="zoom-out" class="w-8 h-8 rounded-lg border border-slate-200 bg-white flex items-center justify-center text-slate-500 hover:bg-slate-50 transition-colors" data-i18n-title="dv.zoomOut">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <span id="zoom-val" class="w-[52px] text-center text-[12.5px] font-semibold text-slate-600">100%</span>

              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button id="zoom-fit" class="rounded-lg border border-slate-200 bg-white px-3 h-8 text-[12.5px] font-semibold text-slate-600 hover:bg-slate-50 transition-colors" data-i18n="dv.fit"></button>

  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script>
  (function () {
    const esc = App.esc;
    const T   = k => I18N.t(k);
    const user = App.initChrome();
    if (!user) return;

    const params = new URLSearchParams(location.search);
    const docId  = params.get('id');
    let doc = Store.getDoc(docId);

    /* มาจากปุ่ม "พรีวิว" ในหน้างาน → ปุ่มย้อนกลับพากลับไปที่งานนั้น */
    const cameFrom = document.referrer || '';
    document.getElementById('back-link').setAttribute('href',
      cameFrom.indexOf('create.html') !== -1 ? cameFrom : user.home);

    if (!doc) {
      document.getElementById('bc-doc').textContent = T('dv.notFound');
      document.getElementById('pdf-stage').innerHTML =
        '<div class="paper flex items-center justify-center text-slate-400">' + esc(T('dv.notFound')) + '</div>';
      document.getElementById('info-scroll').innerHTML =
        '<p class="p-6 text-[13px] text-slate-400">' + esc(T('dv.notFound')) + '</p>';
      return;
    }

    /* ══════════════ PDF pages ══════════════ */
    let zoom = 0.78, tab = 'dar';

    function fld(v, w) {
      return '<span class="ph" style="min-width:' + (w || 140) + 'px">&nbsp;' + esc(v || '') + '&nbsp;</span>';
    }
    function box(on) { return '<span class="chk' + (on ? ' on' : '') + '"></span>'; }

    const D = App.dayLabel;

    /* วันที่จากช่องปฏิทิน (yyyy-mm-dd) → dd/mm/yyyy สำหรับพิมพ์ลงกระดาษ */
    function fmtDate(v) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
      return m ? (m[3] + '/' + m[2] + '/' + m[1]) : (v || '');
    }

    function signCell(label, sig, name) {
      const has = !!sig;
      const img = has && sig.img;
      return '<div style="flex:1;text-align:center">' +
        '<div class="bx" style="height:74px;display:flex;align-items:center;justify-content:center;background:' + (has ? '#f8fafc' : '#fff') + '">' +
          (img
            ? '<img src="' + esc(sig.img) + '" style="max-height:66px;max-width:96%;object-fit:contain" alt="" />'
            : (has
              ? '<span style="font-family:cursive;font-size:21px;color:#1e3a8a;transform:rotate(-4deg);display:inline-block">' + esc((name || '').slice(0, 18)) + '</span>'
              : '<span style="color:#cbd5e1;font-size:11px">' + esc(T('sh.waiting')) + '</span>')) +
        '</div>' +
        '<div style="font-size:11.5px;margin-top:6px">' + esc(label) + '</div>' +
        /* ชื่อ/วันเวลา ใช้ค่าที่ผู้ลงนามกรอกไว้ในฟอร์มก่อน ถ้าไม่มีจึงใช้ค่าเริ่มต้น */
        '<div style="font-size:11px;color:#64748b;margin-top:2px">' +
          esc(T('cr.name')) + ' ' + fld(has ? ((sig.name || name || '')) : '', 90) + '</div>' +
        /* ตำแหน่งที่ผู้ลงนามเลือกไว้ตอนเซ็น */
        '<div style="font-size:11px;color:#64748b;margin-top:3px">' +
          esc(T('cr.position')) + ' ' + fld(has ? (sig.position || '') : '', 90) + '</div>' +
        '<div style="font-size:11px;color:#64748b;margin-top:3px">' +
          esc(T('cr.signDate')) + ' ' + fld(has ? (fmtDate(sig.at) || D(sig.day)) : '', 60) + '</div>' +
      '</div>';
    }

    function renderPaper() {
      const lang = I18N.getLang();
      const title = Store.docTitle(doc, lang);
      const reqName = lang === 'en' ? doc.requesterNameEn : doc.requesterName;
      const reqUser = Store.USERS.find(u => u.id === doc.requesterId) || Store.USERS[0];
      const stk = doc.stakeholders || [];
      /* ชื่อผู้ลงนามประจำบทบาท — ใช้เมื่อยังไม่มีชื่อที่กรอกไว้ในลายเซ็น */
      const byRole = (role) => {
        const u = Store.USERS.filter(x => x.role === role)[0];
        return u ? (lang === 'en' ? u.nameEn : u.name) : '';
      };
      const ownerName = byRole('owner') || doc.requesterDept;
      const sg = doc.signatures || {};

      const p1 =
        '<div class="paper">' +
          '<div style="display:flex;align-items:center;gap:12px;border-bottom:2px solid #0f172a;padding-bottom:10px">' +
            '<img src="image/logo.png" style="width:42px;height:42px;object-fit:cover;border-radius:6px" alt="" />' +
            '<div style="flex:1">' +
              '<h1>แบบคำขอดำเนินการเกี่ยวกับเอกสาร (Document Action Request)</h1>' +
              '<div style="font-size:11.5px;color:#475569">Riverpark · Quality Management System — ISO 9001:2015</div>' +
            '</div>' +
            '<div style="text-align:right;font-size:11px;color:#475569">' +
              '<div><b style="color:#0f172a;font-size:13px">' + esc(doc.id) + '</b></div>' +
              '<div>FM-QP-005-01 Rev.3</div>' +
            '</div>' +
          '</div>' +

          '<div class="sec">' + esc(T('cr.s1')) + '</div>' +
          '<table style="margin-top:8px"><tr>' +
            '<td style="width:50%">' + esc(T('cr.empId')) + ' : ' + fld(doc.requesterEmpId || reqUser.empId) + '</td>' +
            '<td>' + esc(T('cr.date')) + ' : ' + fld(doc.requestDate || D(doc.createdDay), 90) + '</td>' +
          '</tr><tr>' +
            '<td style="padding-top:7px">' + esc(T('cr.name')) + ' : ' + fld(reqName, 190) + '</td>' +
            '<td style="padding-top:7px">' + esc(T('cr.dept')) + ' : ' + fld(doc.requesterDept, 130) + '</td>' +
          '</tr></table>' +

          '<div class="sec">' + esc(T('cr.s2')) + '</div>' +
          '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px">' +
            ['new', 'edit', 'cancel', 'copy', 'other'].map(k =>
              '<div style="display:flex;align-items:center">' + box(doc.purpose === k) + esc(Store.purposeLabel(k, lang)) + '</div>').join('') +
          '</div>' +
          (doc.purposeDetail ? '<div style="margin-top:8px">' + esc(T('cr.detail')) + ' : ' + fld(doc.purposeDetail, 320) + '</div>' : '') +

          '<div class="sec">' + esc(T('cr.s3')) + '</div>' +
          '<div style="margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px 18px">' +
            Object.keys(Store.DOC_TYPES).map(k =>
              '<div style="display:flex;align-items:center">' + box(doc.type === k) + esc(Store.docTypeLabel(k, lang)) + '</div>').join('') +
          '</div>' +

          '<div class="sec">' + esc(T('cr.s4')) + '</div>' +
          '<table style="margin-top:8px"><tr>' +
            '<td style="width:58%">' + esc(T('cr.docName')) + ' : ' + fld(title, 210) + '</td>' +
            '<td>' + esc(T('cr.docNo')) + ' : ' + fld(doc.docNo, 120) + '</td>' +
          '</tr><tr>' +
            '<td style="padding-top:7px">' + esc(T('cr.revision')) + ' : ' + fld(String(doc.revision), 50) + '</td>' +
            '<td style="padding-top:7px">' + esc(T('cr.relatedDept')) + ' : ' + fld(doc.relatedDept, 110) + '</td>' +
          '</tr></table>' +
          '<div style="margin-top:9px">' + esc(T('cr.desc')) + ' :</div>' +
          '<div class="bx" style="margin-top:5px;min-height:74px;padding:8px 10px;font-size:12px;white-space:pre-wrap">' + esc(doc.description) + '</div>' +
          '<div style="margin-top:9px;font-size:12px">' + esc(T('cr.effective')) + ' ' + fld(doc.effectiveDate || '', 110) + '</div>' +

          '<div style="margin-top:22px;display:flex;justify-content:space-between;font-size:10.5px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:7px">' +
            '<span>' + esc(doc.id) + ' · ' + esc(doc.docNo) + '</span><span>1 / 2</span>' +
          '</div>' +
        '</div>';

      const p2 =
        '<div class="paper">' +
          '<div class="sec" style="margin-top:0">' + esc(T('cr.s5')) + '</div>' +
          /* วงเล็บสำคัญ: ถ้าไม่ครอบ เงื่อนไขจะกินสตริงทั้งก้อน ทำให้หน้า 2 ไม่ถูกสร้าง */
          '<div style="margin-top:8px">' +
            ((doc.files || []).length
              ? (doc.files || []).map((f, i) =>
                  '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #e2e8f0">' +
                    '<span style="color:#64748b">' + (i + 1) + '.</span>' +
                    '<span style="flex:1">' + esc(f.name) + '</span>' +
                    '<span style="color:#64748b;font-size:11px">' + (f.size / 1024).toFixed(0) + ' KB</span>' +
                  '</div>').join('')
              : '<div style="color:#94a3b8">' + esc(T('common.empty')) + '</div>') +
          '</div>' +

          '<div class="sec">' + esc(T('cr.s6')) + '</div>' +
          '<div style="margin-top:10px;display:flex;gap:22px">' +
            signCell(T('th.requester'), sg.requester || { day: doc.createdDay }, reqName) +

    /* ── ไฟล์แนบ: เปิดไฟล์จริงที่ผู้ใช้อัปโหลด ── */
    function renderFiles() {
      const files = doc.files || [];
      if (!files.length) {
        return '<div class="paper" style="min-height:120mm;display:flex;align-items:center;justify-content:center;color:#94a3b8">' +
               esc(T('common.empty')) + '</div>';
      }

      return files.map((f, i) => {
        const url = Store.fileURL(f);
        const kind = Store.fileKind(f);
        let body;

        if (url && kind === 'pdf') {
          body = '<iframe src="' + url + '#toolbar=0" style="width:100%;height:210mm;border:1px solid #e2e8f0;border-radius:6px;background:#fff"></iframe>';
        } else if (url && kind === 'image') {
          body = '<div style="border:1px solid #e2e8f0;border-radius:6px;padding:10px;background:#fff;text-align:center">' +
                 '<img src="' + url + '" style="max-width:100%;max-height:200mm;object-fit:contain" alt="" /></div>';
        } else {
          const msg = f.dropped ? T('dv.fileDropped') : (url ? T('dv.noPreview') : T('dv.noFile'));
          body =
            '<div style="border:1px dashed #cbd5e1;border-radius:8px;background:#f8fafc;padding:26px;text-align:center;color:#64748b">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
              '<div style="margin-top:10px;font-size:12px;line-height:1.6">' + esc(msg) + '</div>' +
            '</div>' +
            /* ตัวอย่างหน้ากระดาษจำลอง สำหรับข้อมูลตัวอย่างที่ไม่มีไฟล์จริง */
            '<div style="margin-top:16px;display:flex;flex-direction:column;gap:9px;opacity:.55">' +
              [92, 78, 96, 64, 88, 71, 94, 55, 83].map(w =>
                '<div style="height:9px;border-radius:4px;background:#e8edf4;width:' + w + '%"></div>').join('') +
            '</div>';
        }

        const actions = url
          ? '<a href="' + url + '" download="' + esc(f.name) + '" style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#2563eb;text-decoration:none">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>' +
              esc(T('act.download')) + '</a>' +
            '<a href="' + url + '" target="_blank" rel="noopener" style="margin-left:14px;font-size:11.5px;font-weight:600;color:#64748b;text-decoration:none">' + esc(T('dv.openTab')) + '</a>'
          : '';

        return '<div class="paper" style="min-height:120mm">' +
            '<div style="display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0;padding-bottom:9px">' +
              '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="' + (kind === 'pdf' ? '#dc2626' : '#2563eb') + '" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>' +
              '<div style="flex:1;min-width:0">' +
                '<div style="font-weight:700;word-break:break-all">' + esc(f.name) + '</div>' +
                '<div style="font-size:11px;color:#64748b">' + (f.size / 1024).toFixed(0) + ' KB · ' +
                  esc(f.kind === 'dar' ? T('dv.pdf') : T('dv.attach')) + ' · ' + (i + 1) + '/' + files.length + '</div>' +
              '</div>' +
              '<div style="flex-shrink:0">' + actions + '</div>' +
            '</div>' +
            '<div style="margin-top:14px">' + body + '</div>' +
          '</div>';
      }).join('');
    }

    function paintStage() {
      const stage = document.getElementById('pdf-stage');
      stage.innerHTML = '<div id="pdf-pages">' + (tab === 'dar' ? renderPaper() : renderFiles()) + '</div>';
      applyZoom();
    }

    /* ย่อ/ขยายทั้งกองหน้ากระดาษพร้อมกัน แล้วหักความสูงส่วนเกินออก
       เพื่อไม่ให้เหลือช่องว่างท้ายหน้าตอนซูมออก */
    function applyZoom() {
      const pages = document.getElementById('pdf-pages');
      if (!pages) return;
      pages.style.transform = 'scale(' + zoom + ')';
      pages.style.marginBottom = '0px';
      const h = pages.offsetHeight;
      pages.style.marginBottom = -(h * (1 - zoom)) + 'px';
      document.getElementById('zoom-val').textContent = Math.round(zoom * 100) + '%';
    }

    function fit() {
      const stage = document.getElementById('pdf-stage');
      const avail = stage.clientWidth - 56;
      const mm = 210 * 3.7795;          /* 210mm → px */
      zoom = Math.max(0.35, Math.min(1.5, avail / mm));
      applyZoom();
    }

    document.getElementById('zoom-in').addEventListener('click', () => { zoom = Math.min(1.6, zoom + 0.1); applyZoom(); });
    document.getElementById('zoom-out').addEventListener('click', () => { zoom = Math.max(0.35, zoom - 0.1); applyZoom(); });
    document.getElementById('zoom-fit').addEventListener('click', fit);
    document.getElementById('btn-print').addEventListener('click', () => {
      const keep = zoom; zoom = 1; applyZoom();
      setTimeout(() => { window.print(); zoom = keep; applyZoom(); }, 120);
    });

    document.querySelectorAll('.v-tab').forEach(b => {
      b.addEventListener('click', () => {
        tab = b.getAttribute('data-vtab');
        document.querySelectorAll('.v-tab').forEach(x => {
          x.classList.remove('bg-blue-600', 'text-white');
          x.classList.add('text-slate-500');
        });
        b.classList.add('bg-blue-600', 'text-white');
        b.classList.remove('text-slate-500');
        paintStage();
      });
    });

          '</div>' +

            '<p class="text-[15px] font-bold mt-0.5 ' + (active && rem <= 2 ? 'text-red-600' : (active && rem <= 4 ? 'text-amber-600' : 'text-slate-800')) + '">' +

        [T('cr.dept'), doc.requesterDept],
        [T('cr.date'), doc.requestDate],
        [T('th.type'), Store.docTypeLabel(doc.type, lang)],
        [T('cr.s2'), Store.purposeLabel(doc.purpose, lang)],
        [T('cr.detail'), doc.purposeDetail],
        [T('cr.docNo'), doc.docNo],
        [T('cr.revision'), String(doc.revision)],
        [T('cr.relatedDept'), doc.relatedDept],
        [T('cr.effective'), doc.effectiveDate],

      /* เจ้าหน้าที่ควบคุมคุณภาพ — ลงนามส่วนที่ 6 ต้องทำในหน้าเอกสาร (create.html) */
      if (p.qcSign) btns.push('<a href="create.html?id=' + encodeURIComponent(doc.id) + '" class="w-full inline-flex items-center justify-center gap-2 rounded-xl px-4 py-3 text-[13.5px] font-semibold text-white no-underline transition-all" style="background:#0d9488;box-shadow:0 6px 16px rgba(13,148,136,.25)">' + esc(T('act.qcStaffSign')) + '</a>');
      if (p.register) btns.push(B('a-register', T('act.register'), 'background:#0d9488;box-shadow:0 6px 16px rgba(13,148,136,.25)', 'text-white'));

      if (!btns.length) {
        let msg = T('dv.noAccess');
        if (user.role === 'stakeholder' && doc.status === st.PENDING_SIGN) msg = T('dv.waitOther');
        if (doc.status === st.PENDING_OWNER && user.role !== 'owner') msg = T('ow.waiting');
        if (doc.status === st.PENDING_QC_MANAGER && user.role !== 'qcManager') msg = T('qm.waiting');
        if ([st.REJECTED, st.REGISTERED].indexOf(doc.status) !== -1) msg = T('dv.closed');
        bar.innerHTML = '<p class="rounded-xl bg-slate-50 px-4 py-3.5 text-center text-[12.5px] text-slate-400 leading-relaxed">' + esc(msg) + '</p>';
        return;
      }
      bar.innerHTML = '<div class="flex flex-col gap-2.5">' + btns.join('') + '</div>';

      const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };

      on('a-send', async () => {
        const r = await App.confirmDialog({ title: T('act.send'), sub: T('dv.confirmSend'), tone: 'blue', needNote: true });
        if (!r) return;
        doc = Store.send(doc.id, user, r.note);
        App.toast(T('cr.sentOk')); refresh();
      });
      on('a-approve', async () => {
        const r = await App.confirmDialog({ title: T('act.approve'), sub: T('dv.confirmApprove'), tone: 'green', needNote: true });
        if (!r) return;
        doc = Store.approve(doc.id, user, r.note);
        App.toast(T('n.approved')); refresh();
      });
      on('a-return', async () => {
        const isQC = user.role === 'qc';
        const r = await App.confirmDialog({
          title: isQC ? T('act.qcReturn') : T('act.return'),
          sub: isQC ? T('qc.confirmReturn') : T('dv.confirmReturn'),
          tone: 'amber', needNote: true, noteRequired: true });
        if (!r) return;
        doc = Store.returnForEdit(doc.id, user, r.note);
        App.toast(T('n.returned'), 'amber'); refresh();
      });
      on('a-register', async () => {
        const r = await App.confirmDialog({ title: T('act.register'), sub: T('qc.confirmRegister'), tone: 'green', needNote: true });
        if (!r) return;
        doc = Store.register(doc.id, user, r.note);
        App.toast(T('n.registered')); refresh();
      });
      on('a-reject', async () => {
        const r = await App.confirmDialog({ title: T('act.reject'), sub: T('dv.confirmReject'), tone: 'red', needNote: true, noteRequired: true });
        if (!r) return;
        doc = Store.reject(doc.id, user, r.note);
        App.toast(T('n.rejected'), 'red'); refresh();
      });
      on('a-sign', async () => {
        const r = await App.confirmDialog({ title: T('act.sign'), sub: T('dv.confirmSign'), tone: 'violet', needNote: true });
        if (!r) return;
        doc = Store.sign(doc.id, user, r.note);
        App.toast(doc.status === Store.STATUS.SENT_TO_QC ? T('n.allSigned') : T('n.signed')); refresh();
      });
    }

    function refresh() {
      doc = Store.getDoc(doc.id);
      renderInfo();
      renderActions();
      paintStage();
    }

    document.addEventListener('langchange', refresh);
    window.addEventListener('resize', () => { if (document.getElementById('pdf-stage').clientWidth) fit(); });

    paintStage();
    renderInfo();
    renderActions();
    setTimeout(fit, 60);
  })();
  </script>

</body>
</html>
